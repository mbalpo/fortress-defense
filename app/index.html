<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b16">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fortress">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Fortress Defense</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #070b16; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block; background: #0b1224;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* schermata Salvataggio: pannello HTML sopra il gioco (servono veri pulsanti per file, condivisione e appunti) */
  .panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(7,11,22,0.72); z-index: 5; }
  .panel[hidden] { display: none; }
  .card { width: 100%; max-width: 340px; max-height: 100%; overflow-y: auto; background: #101a33; border: 1px solid #2c4272; border-radius: 14px; padding: 16px; color: #e8eefc; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card h2 { margin: 0 0 4px; font-size: 19px; }
  .card .info { margin: 0 0 12px; color: #9fb4d9; font-size: 13px; }
  .card .sub { margin: 14px 0 6px; color: #9fb4d9; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .card button, .card .btn { display: block; width: 100%; box-sizing: border-box; margin: 0 0 8px; padding: 11px 12px; border-radius: 9px; border: 1.5px solid #2c4272; background: #13213f; color: #e8eefc; font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; cursor: pointer; }
  .card .row2 { display: flex; gap: 8px; }
  .card .row2 > * { flex: 1; }
  .card .primary { border-color: #3fe0a0; }
  .card .warn { border-color: #ff7a3d; }
  .card .ghost { background: transparent; color: #9fb4d9; margin-top: 6px; }
  .card textarea { display: block; width: 100%; box-sizing: border-box; margin: 0 0 8px; padding: 9px; border-radius: 9px; border: 1.5px solid #2c4272; background: #0b1224; color: #e8eefc; font: 12px/1.35 ui-monospace, Menlo, monospace; resize: vertical; }
  .card .confirm { margin: 10px 0 4px; padding: 10px; border-radius: 9px; background: rgba(255,122,61,0.12); border: 1px solid #ff7a3d; }
  .card .confirm p { margin: 0 0 10px; font-size: 13px; }
  .card .msg { min-height: 18px; margin: 6px 0 0; color: #3fe0a0; font-size: 13px; }
  .card .msg.err { color: #ff8a8a; }
  /* schermata iniziale: copre il gioco finché non si tocca “Start” (intanto controlla gli aggiornamenti) */
  #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    padding: 24px; background: #070b16; color: #e8eefc; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #splash[hidden] { display: none; }
  #splash h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: .04em; text-align: center; }
  #splash img { width: min(62vw, 36vh, 260px); height: auto; border-radius: 22%; }
  #splashMsg { min-height: 40px; margin: 0; display: flex; align-items: center; color: #9fb4d9; font-size: 16px; font-weight: 600; }
  #splash.ready { cursor: pointer; }
  #splash.ready #splashMsg { color: #3fe0a0; font-size: 26px; font-weight: 800; letter-spacing: .06em; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Campo di battaglia"></canvas>
<script src="draw.js"></script>
<div id="splash" role="button" aria-label="Fortress Defense">
  <h1>FORTRESS DEFENSE</h1>
  <img src="icon-512.png" alt="" width="512" height="512">
  <p id="splashMsg" role="status"></p>
</div>
<div id="savePanel" class="panel" hidden>
  <div class="card" role="dialog" aria-labelledby="saveTitle">
    <h2 id="saveTitle">Salvataggio</h2>
    <p id="saveInfo" class="info"></p>
    <p class="sub">Esporta</p>
    <div class="row2"><button id="btnExport" class="primary">File</button><button id="btnCopy">Copia codice</button></div>
    <p class="sub">Importa</p>
    <label class="btn" for="fileImport">Scegli un file di salvataggio</label>
    <input type="file" id="fileImport" accept=".json,application/json,text/plain" hidden>
    <textarea id="codeBox" rows="3" placeholder="Oppure incolla qui un codice di salvataggio"></textarea>
    <button id="btnPaste">Importa il codice incollato</button>
    <div id="confirmBox" class="confirm" hidden>
      <p id="confirmText"></p>
      <div class="row2"><button id="btnConfirm" class="warn">Sostituisci</button><button id="btnCancel">Annulla</button></div>
    </div>
    <p id="saveMsg" class="msg" role="status"></p>
    <button id="btnClose" class="ghost">Chiudi</button>
  </div>
</div>
<script>
"use strict";
(() => {
const W = 360, H = 640;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
// DISEGNO: sta in draw.js (condiviso con il catalogo grafico). Si valuta qui, dentro l’ambito del gioco, così vede lo stato.
const DRAW = eval("(" + FORTRESS_DRAW + ")")();
const { draw, FX, thunderDraw, teslaDraw } = DRAW;

/* =====================================================================
   DATI — tipi di danno, nemici, ondate. I numeri sono segnaposto.
   ===================================================================== */
const TYPES = {
  force:    { name: "Force",    color: "#b07cff" },
  energy:   { name: "Energy",   color: "#3fe0ff" },
  electric: { name: "Electric", color: "#ffe14d" },
  fire:     { name: "Fire",     color: "#ff7a3d" },

};
// RESIST[tipo nemico][tipo danno] = moltiplicatore sul danno
const RESIST = {
  force:    { force: 0.5, energy: 1,   electric: 1.5, fire: 1,   physical: 1   },
  energy:   { force: 1,   energy: 0.5, electric: 1,   fire: 1.5, physical: 1   },
  electric: { force: 1,   energy: 1,   electric: 0.5, fire: 1,   physical: 1.5 },
  fire:     { force: 1.5, energy: 1,   electric: 1,   fire: 0.5, physical: 1   },
  physical: { force: 1,   energy: 1.5, electric: 1,   fire: 1,   physical: 0.5 },
};

// dmg = danno alla cupola a ogni attacco (ogni ATTACK_EVERY secondi, a contatto)
const ATTACK_EVERY = 1.2;
const ENEMY_DEFS = {
  drone:   { type: "electric", hp: 30,  speed: 50, r: 11, dmg: 2,   look: "saucer"   },   // navicella
  wisp:    { type: "energy",   hp: 22,  speed: 60, r: 9,  dmg: 1.5, look: "shard"    },   // cristallo-cometa
  brute:   { type: "force",    hp: 140, speed: 28, r: 16, dmg: 6,   look: "asteroid" },   // asteroide
  spitter: { type: "fire",     hp: 60,  speed: 42, r: 13, dmg: 3,   look: "meteor"   },   // meteora infuocata
  shell:   { type: "physical", hp: 60,  speed: 34, r: 14, dmg: 4,   look: "rock"     },   // frammento roccioso

/* =====================================================================
   CAMPAGNA
   ===================================================================== */
const CAMPAIGN = {
  maxLevel: 200,                           // campagna lunga: almeno 200 livelli (Marco)
  towerCaps: [[0, 1], [10, 2], [20, 3]],   // [livelli completati, livello massimo delle torri]
  bossFrom: 11, bossWaves: [5, 10, 15],    // mini-boss dal livello 11 (dopo il 10), a queste ondate
  bossCards: 3,                            // carte a caso ricevute (e applicate subito) per ogni mini-boss sconfitto

  smallUntil: 10,                          // fino a questa difficoltà solo nemici "piccoli"
  epicUnlock: 50, epicOffset: 30,          // Epica: difficoltà = livello + 30
  equipUnlock: 30, barrierUnlock: 40,      // equipaggiamento (DESIGN.md § 15) e abilità della barriera (§ 16)
  sealsFrom: 31, sealsStandard: 1, sealsEpic: 3,   // Sigilli: dal livello 31 in Standard (1), da subito in Epica (3); DESIGN.md § 16

const UP_W = { std: 1, chain: 0.4, combo: 0.4, lu: 2 };   // chain e combo escono meno degli standard
const diffOf = (lv, epic) => lv + (epic ? CAMPAIGN.epicOffset : 0);
// Scalatura per difficoltà D (livello standard, o livello+30 in Epica). Tarata solo fino a D≈30.
const LV = { hp0: 0.42, hpSlope: 0.08, hpSlopeHi: 0.02, dmg: 0.01, speed: 0.002, count: 0.005 };
// fino a D=10 la vita sale in fretta (da nemici deboli al "muro"); dopo sale piano, perché le scelte per partita non crescono
// difficoltà effettiva: tra il 20 e il 30 sale piano (la potenza del giocatore è ferma fino al boss del 30); dal 31 sale di 0,2 per livello,
// tarata con i bot che spendono i Sigilli attesi nell’albero (1,5 per livello dal 31) perché i livelli tra un muro e l’altro restino intorno al 60-80%
const EFF_SLOPE_31 = 1.2, EFF_JUMP_31 = 3;   // 1.12.0: pendenza 1,2 e scalino di 3 dal 31 (1.11.0: 0,8 e 2), con albero, equipaggiamento e un po’ di Epica attesi (muri dal 40 al 50-70%)
const effD = (D) => D <= 20 ? D : D <= 30 ? 20 + 0.3 * (D - 20) : 23 + EFF_JUMP_31 + EFF_SLOPE_31 * (D - 30);
const levelHp    = (D) => { D = effD(D); return D <= 10 ? LV.hp0 + LV.hpSlope * (D - 1) : LV.hp0 + LV.hpSlope * 9 + LV.hpSlopeHi * (D - 10); };
const levelDmg   = (D) => 1 + LV.dmg * (effD(D) - 1);
const levelSpeed = (D) => 1 + LV.speed * (effD(D) - 1);
const levelCount = (D) => 1 + LV.count * (effD(D) - 1);

function waveSpec(n, D) {
  const small = D <= CAMPAIGN.smallUntil;
  const kinds = small ? ["drone", "wisp", "spitter", "shell"] : ["drone", "wisp", "spitter", "shell", "brute"];
  const L = kinds.length, a = kinds[(n - 1) % L], b = kinds[small ? (n * 3 + 1) % L : (n * 2 + 1) % L];
  const size = (k, base) => Math.max(2, Math.round(base * levelCount(D) * (k === "brute" ? 0.3 : k === "wisp" ? 1.3 : 1)));
  const every = Math.max(0.6, 1.5 - 0.035 * n);
  const ca = size(a, 3 + n * 0.7), cb = n < 3 ? 0 : size(b, 1 + n * 0.4);
  return { groups: [
    { enemy: a, count: ca, every, at: 0 },
    { enemy: b, count: cb, every: every * 1.2, at: ca * every * 0.5 },
  ]};
}
const TYPE_KEYS = ["fire", "energy", "electric", "force", "physical"];
const bossDef = (lv, n) => ({ type: TYPE_KEYS[(lv + n / 5) % 5], hp: 480, speed: 20, r: 24, dmg: 9, boss: true, look: "ship",
  kbRes: 0.4 + 0.1 * ((lv * 7 + n / 5) % 5), statRes: 0.25 + 0.1 * ((lv * 3 + n / 5) % 4) });   // resistenze variabili: spinte 40-80%, stati 25-55%
// vita base del boss finale, tarata con i bot perché i muri si superino circa nel 30% delle partite (scelta di Marco):
// 10, 20, 30 sul pool libero; dal 40 con l’albero atteso e le abilità della barriera, 1450 × (1 + 1,5 · n^0,35) con n = decine dopo il 40 (cresce in fretta all’inizio, poi piano)
const FINAL_BOSS_HP = { 10: 400, 20: 2250, 30: 1450 };
// fattore per singolo muro (1.11.0): corregge i muri che con l’equipaggiamento atteso uscivano dalla fascia 50-70% [Claude, provvisorio]
const FINAL_BOSS_K = { 40: 1.2, 60: 0.6, 80: 1.3, 90: 0.6, 100: 0.75, 120: 1.15, 130: 1.15, 170: 1.5, 190: 0.75 };
const finalBossHp = (lv) => FINAL_BOSS_HP[lv] || FINAL_BOSS_HP[30] * (1 + 1.5 * Math.pow(Math.max(0, lv / 10 - 4), 0.35)) * (FINAL_BOSS_K[lv] || 1);
// vita dei nemici normali nei livelli muro (oltre al boss): solo il 10, dove si muore anche prima del boss
const WALL_ENEMY_HP = { 10: 0.93 };
const finalBossDef = (lv) => ({ type: TYPE_KEYS[(lv / 10) % 5], hp: finalBossHp(lv), speed: 14, r: 34, dmg: 8, boss: true, final: true, look: "mothership", kbRes: 0.85, statRes: 0.6 });   // vita che cresce con il livello
const hasMiniBosses = () => mode === "epic" || campLevel >= CAMPAIGN.bossFrom;   // in Epica fin dal livello 1
const hasFinalBoss = () => campLevel % CAMPAIGN.finalBossEvery === 0;
const waveHp    = (n) => 1 + 0.09 * (n - 1);
const waveSpeed = (n) => 1 + 0.012 * (n - 1);
const waveDmg   = (n) => 1 + 0.04 * (n - 1);
const MODES = { standard: { label: "Standard" }, epic: { label: "Epica" } };

// Sblocchi permanenti (per ora a mano). È qui che scriverà l’albero dei Sigilli (DESIGN.md § 16).
// Esempio: startTurrets: ["sky", "rail"], domeAbilities: ["regen", "repulse"], unlocked: { sky: ["burn1", "burn2"] }
const META = {
  startTurrets: [],        // vuoto = si parte senza torrette
  domeHp: 100,
  domeReduction: 0,        // 0..1: riduzione del danno subito dalla cupola
  domeAbilities: [],       // abilità della barriera a mano, per le prove: id di ABILITIES (es. "regen", "repulse"), al livello dell’albero o 1
  unlocked: {},            // carte di TREE_LOCKS sbloccate con i Sigilli, per entità: { player: [...], sky: [...] }
};

/* =====================================================================
   POTENZIAMENTI
   cat: "std" (standard, max 3 pile) · "chain" (catena a livelli, chain+lv)
        "lu" (level up, serve per avanzare di livello) · "combo" (sinergie, vuoto per ora)
   Ogni torre parte al livello 1: 3 potenziamenti, poi un level up per salire.
   Livello massimo 3 → 12 potenziamenti in tutto. Un level up di livello
   inferiore resta disponibile ai livelli successivi.
   prov = voce provvisoria inventata per non lasciare buchi (da sostituire).
   ===================================================================== */
const S = (id, name, desc) => ({ id, cat: "std", name, desc });
const C = (id, chain, lv, name, desc) => ({ id, cat: "chain", chain, lv, name, desc });
const L = (id, lv, name, desc, prov) => ({ id, cat: "lu", lv, name, desc, prov: !!prov });
// combo del guardiano con una torretta: needs = torretta in campo; cond = livello minimo della torretta (numero) o voce chain scelta (id);
// lv = livello minimo del guardiano. Conta come scelta del guardiano.
const K = (id, needs, cond, lv, name, desc) => ({ id, cat: "combo", needs, cond, lv, name, desc });

const PLAYER_DEF = { id: "player", name: "Guardiano", type: "physical", ups: [

const TURRETS = {
  sky: { name: "Sky Guard", type: "fire", range: 520, reload: 3.0, blurb: "Missili a ricerca casuale, lungo raggio", ups: [

// Albero dei Sigilli (DESIGN.md § 16). Ogni nodo ha un livello da 0 a max; costs[L] = Sigilli per passare dal livello L al L+1.
// Regola dei livelli: un nodo non supera il livello dei nodi da cui dipende (req).
// Fase 1, sblocchi (generati da TREE_LOCKS): chain da 3 voci in sequenza, le altre carte bloccate, “Sblocco permanente” dopo tutti gli altri.
// Fase 2, nodi numerici: carte standard di ogni torretta e del guardiano, sezione condivisa per tipo, spina e rami della barriera.
// Costi e valori [Claude, provvisori].
// Sigilli (◆) e Sigilli maggiori (✦, 1.12.0, Marco): le carte bloccate costano quanto il loro livello (lv1 1, lv2 2, lv3 3); lo Sblocco permanente 3 maggiori;
// le abilità d’ingresso della barriera 1 Sigillo, le altre 3. mcosts[L] = Sigilli maggiori per passare dal livello L al L+1.
const SEAL_COST = { chain: [1, 2, 3], permMajor: 3, abilityEntry: 1, abilityUnlock: 3 };

const levelCost = (L) => 1 + Math.floor((L - 1) / 5);
const CAT_NAME = { lu: "Level up", std: "Standard" };
// potenziamento delle carte standard: per livello del nodo, bonus in % e a numero ×(1 + 0,4·L), riduzioni della ricarica ×(1 + 0,2·L),
// malus −1/3 per livello (zero al 3, poi diventa bonus)
const STD_BOOST = { bonus: 0.4, reduce: 0.2, max: 5, maxDmg: 20 };   // i nodi del danno arrivano al 20 (crescita lunga, campagna fino a 200 e oltre)
const STD_KIND = { dmg: ["pct", 0.25], msl: ["mal", 0.15], rad: ["pct", 0.3], "vortex:rad": ["pct", 0.25], bounce: ["mal", 0.15], "laser:bounce": ["mal", 0.2],
  dur: ["pct", 0.3], height: ["pct", 0.3], proj: ["mal", 0.15], fast: ["fast", 0.1], sph: ["mal", 0.15], cd: ["red", 0.12], drone: ["mal", 0.15],
  hits: ["cnt", 2], pierce: ["cnt", 1], len: ["pct", 0.3] };
const stdKind = (who, id) => STD_KIND[who + ":" + id] || STD_KIND[id];

const frenzyK = (L) => 1.35 + 0.55 * L;         // Frenesia potenziata: moltiplicatore del danno in frenesia (×1,35 → ×3)

function stdFx(kind, v, L) {                    // effetto per pila della carta con il nodo al livello L
  if (kind === "pct") return "+" + pctS(v * (1 + STD_BOOST.bonus * L));
  if (kind === "red") return "ricarica −" + pctS(v * (1 + STD_BOOST.reduce * L));
  if (kind === "fast") return "danno +" + pctS(v * (1 + STD_BOOST.bonus * L)) + ", ricarica −" + pctS(v * (1 + STD_BOOST.reduce * L));
  if (kind === "cnt") return "+" + Math.round(v * (1 + STD_BOOST.bonus * L));
  const m = v * (1 - L / 3); return m > 1e-9 ? "danno −" + pctS(m) : m < -1e-9 ? "danno +" + pctS(-m) : "nessun malus";

const TREE_VAL = { typeDmg: 0.06, allDmg: 0.03, statDur: 0.06, hpPct: 0.1, red: 0.03, hpFlat: 10, abCd: 0.05, ignore: 0.02, cards: 0.05 };
const TREE_CAP = { red: 0.4, abCd: 0.6 };      // tetti sul totale (equipaggiamento + albero): riduzione del danno e del cooldown delle abilità

const lvNode = (id, who, name, max, fx, req, maj) => ({ id, who, kind: "level", name, max, costs: Array.from({ length: max }, (_, i) => levelCost(i + 1)),

    nodes.push(one({ id: who + ":" + u.id, who, card: u.id, kind: "chain", name: u.name, sub: "Chain " + arr[0].name + " · voce lv" + u.lv,
      req: i ? [who + ":" + arr[i - 1].id] : [] }, SEAL_COST.chain[u.lv - 1])));

    nodes.push(one({ id: who + ":" + u.id, who, card: u.id, kind: "card", name: u.name, req: [],
      sub: u.cat === "chain" ? "Chain " + def.ups.find((v) => v.chain === u.chain && v.lv === 1).name + " · voce lv" + u.lv : CAT_NAME[u.cat] + " lv" + u.lv }, u.lv));   // costo = livello della carta

  : progress.seals < nodeCost(n) || progress.majors < nodeMCost(n) ? "poor" : "ready";

  if (nodeState(n) !== "ready") return false;
  progress.seals -= nodeCost(n); progress.majors -= nodeMCost(n); progress.tree[n.id] = nodeLv(n) + 1; saveProgress(); return true;

function sealReward(m, lv, full) {
  const epic = m === "epic";
  if (!epic && lv < CAMPAIGN.sealsFrom) return { got: 0, why: "none" };
  const key = (epic ? "e" : "s") + lv, n = epic ? CAMPAIGN.sealsEpic : CAMPAIGN.sealsStandard;
  if (!progress.claims.includes(key)) { progress.claims.push(key); progress.seals += n; return { got: n, why: "first", next: !progress.claims.includes(key + "p") }; }
  if (!progress.claims.includes(key + "p")) {
    if (!full) return { got: 0, why: "needFull" };
    progress.claims.push(key + "p"); progress.seals += n; return { got: n, why: "full" };
  }
  return { got: 0, why: "done" };
}

// eq = pezzi equipaggiati { arma: { r, m: [[effetto, rarità], …] } } (i Moduli installati non stanno nell’inventario)
function cleanGear(p) {                           // da dati qualsiasi: tiene solo pezzi, Moduli e installazioni validi

const gearCount = (g, kind, pc) => Object.entries(g[kind]).reduce((a, [k, v]) => a + (!pc || k.startsWith(pc + ":") ? v : 0), 0);
// equipaggia un pezzo dell’inventario: quello di prima torna in inventario; i suoi Moduli passano al nuovo finché ci sono slot, gli altri tornano in inventario
function equipPiece(pc, r) {
  const g = progress.gear; if (!gearOpen() || !qty(g.pcs, pcKey(pc, r))) return false;
  const old = g.eq[pc], m = old ? old.m : [];
  bump(g.pcs, pcKey(pc, r), -1);
  if (old) bump(g.pcs, pcKey(pc, old.r), 1);
  m.slice(r + 1).forEach(([fx, mr]) => bump(g.mods, modKey(pc, mr, fx), 1));
  g.eq[pc] = { r, m: m.slice(0, r + 1) };

}
function unequipPiece(pc) {                      // toglie il pezzo: pezzo e Moduli tornano in inventario
  const g = progress.gear, e = g.eq[pc]; if (!e) return false;
  bump(g.pcs, pcKey(pc, e.r), 1); e.m.forEach(([fx, mr]) => bump(g.mods, modKey(pc, mr, fx), 1));
  delete g.eq[pc]; saveProgress(); return true;
}
// installa un Modulo nel pezzo equipaggiato del suo tipo: serve uno slot libero e nessun Modulo con lo stesso effetto in quel pezzo
const canInstall = (pc, fx) => { const e = progress.gear.eq[pc]; return !!e && e.m.length < e.r + 1 && !e.m.some((x) => x[0] === fx); };
function installMod(pc, r, fx) {
  const g = progress.gear; if (!qty(g.mods, modKey(pc, r, fx)) || !canInstall(pc, fx)) return false;
  bump(g.mods, modKey(pc, r, fx), -1); g.eq[pc].m.push([fx, r]); saveProgress(); return true;
}
function removeMod(pc, i) {                       // gratis e senza perdite: torna in inventario [deciso]
  const g = progress.gear, e = g.eq[pc]; if (!e || !e.m[i]) return false;
  const [fx, r] = e.m.splice(i, 1)[0]; bump(g.mods, modKey(pc, r, fx), 1); saveProgress(); return true;

// fusione: 5 pezzi uguali (stesso tipo e rarità) → 1 della rarità successiva
function fusePieces(pc, r) {
  const g = progress.gear; if (r >= 4 || qty(g.pcs, pcKey(pc, r)) < 5) return false;
  bump(g.pcs, pcKey(pc, r), -5); bump(g.pcs, pcKey(pc, r + 1), 1); saveProgress(); return true;
}
// fusione dei Moduli: 5 dello stesso pezzo e della stessa rarità, anche con effetti diversi (sel = { effetto: quanti });
// l’effetto del risultato si estrae dal pool del pezzo con i pesi
// Effetti rari (peso 1: 4, 10, 14, 20, 21, 22, 28, 29, 30): insieme escono con RARE_CHANCE[rarità] (5% nel comune → 30% nell’ancestrale) [deciso, Marco;
// valori intermedi Claude]; dentro ciascun gruppo (rari o standard) l’effetto si estrae con i pesi. Vale per drop e fusioni.
const RARE_CHANCE = [0.05, 0.11, 0.18, 0.24, 0.30];
function rollModFx(pc, r) {
  const all = PIECES[pc].pool, rare = all.filter((fx) => MOD[fx].w === 1), std = all.filter((fx) => MOD[fx].w > 1);
  const pool = rare.length && Math.random() < RARE_CHANCE[r || 0] ? rare : std;
  let x = Math.random() * pool.reduce((a, fx) => a + MOD[fx].w, 0);
  for (const fx of pool) if ((x -= MOD[fx].w) < 0) return fx;
  return pool[pool.length - 1];
}
function fuseMods(pc, r, sel) {
  const g = progress.gear, ids = Object.keys(sel).map(Number);
  if (r >= 4 || ids.reduce((a, fx) => a + sel[fx], 0) !== 5 || ids.some((fx) => qty(g.mods, modKey(pc, r, fx)) < sel[fx])) return null;
  ids.forEach((fx) => bump(g.mods, modKey(pc, r, fx), -sel[fx]));
  const fx = rollModFx(pc, r + 1); bump(g.mods, modKey(pc, r + 1, fx), 1); saveProgress(); return fx;
}
function discard(kind, key) {                     // scarto a mano, senza compenso [deciso]

  bump(g[kind], key, -1); saveProgress(); return true;

// drop: a ogni vittoria dal livello 30 (difficoltà almeno 30, quindi anche ogni livello di Epica), anche rigiocando
function rollRarity(D) {

  return 0;
}
function rollDrops(D, epic) {
  const g = progress.gear, out = [], pick = () => PIECE_IDS[Math.floor(Math.random() * PIECE_IDS.length)];
  for (let i = 0; i < DROP.pieces; i++) { const pc = pick(), r = rollRarity(D); bump(g.pcs, pcKey(pc, r), 1); out.push({ kind: "pcs", pc, r }); }
  const nm = DROP.mods + (Math.random() < DROP.modExtra ? 1 : 0) + (epic ? DROP.epicMods : 0);
  for (let i = 0; i < nm; i++) { const pc = pick(), r = rollRarity(D), fx = rollModFx(pc, r); bump(g.mods, modKey(pc, r, fx), 1); out.push({ kind: "mods", pc, r, fx }); }

}
let gearGain = null;                              // oggetti presi nell’ultima vittoria (schermata di vittoria)
// statistiche dell’equipaggiamento per la partita: frazioni (0,1 = 10%); i “+X% danni” del guardiano si sommano in pdmg (un solo bonus)
function gearStats(gear) {
  const s = { pdmg: 0, hp: 0, tdmg: 0, type: {}, crit: 0, perTower: 0, proj: 0, perNear: 0, debuff: 0, rate: 0, ext: 0, perMod: 0, absorb: 0, counter: 0, counterN: 0,
    red: 0, perCard: 0, nearB: 0, lowImm: 0, abCd: 0, heal: 0, pierce: 0, high: 0, explo: 0, maxHp: 0, refresh: 0, four: 0, p2: 0, t2: 0, mods: 0 };
  for (const pc of PIECE_IDS) {
    const e = gear && gear.eq[pc]; if (!e) continue;
    s[PIECES[pc].stat] += PIECES[pc].base[e.r] / 100;
    for (const [fx, r] of e.m) {
      const v = MOD[fx].v[r], f = Array.isArray(v) ? v.map((x) => x / 100) : v / 100; s.mods++;
      switch (fx) {
        case 1: s.crit += f; break;          case 2: s.pdmg += f; break;            case 3: s.perTower += f; break;
        case 4: s.proj++; s.pdmg += f; break; case 5: s.perNear += f; break;         case 6: s.debuff += f; break;
        case 7: s.rate += f; break;          case 8: s.ext += f; break;             case 9: s.perMod += f; break;
        case 10: s.absorb += v[0]; s.counter += f[1]; s.counterN += v[2]; break;
        case 11: s.hp += f[0]; s.red += f[1]; break;
        case 12: s.pdmg += f[0]; s.perCard += f[1]; break;
        case 13: s.nearB += f; break;        case 14: s.lowImm += v; break;          case 15: s.abCd += f; break;
        case 16: s.heal += f; break;         case 17: s.pierce++; s.pdmg += f; break; case 18: s.high += f; break;
        case 19: s.explo += f; break;        case 20: s.maxHp += f; break;           case 21: s.refresh += v; break;
        case 22: s.four += f; break;         case 28: s.tdmg += f; break;            case 29: s.p2 += f; break;   case 30: s.t2 += f; break;
        default: s.type[MOD[fx].type] = (s.type[MOD[fx].type] || 0) + f;       // 23-27: danno di un tipo (torrette)
      }
    }
  }

let GEAR = gearStats(null);                       // statistiche della partita in corso (startRun)
// stato della partita legato all’equipaggiamento (startRun)
let gearAbsorb = 0, counterLeft = 0, lowImmUsed = false, domeImmT = 0, healLeft = 0, refreshLeft = 0, runPicks = 0, turretsLv2 = false;
function gearRun() {
  gearAbsorb = GEAR.absorb; counterLeft = GEAR.counterN; lowImmUsed = false; domeImmT = 0; healLeft = 4; refreshLeft = GEAR.refresh; runPicks = 0;
  turretsLv2 = GEAR.t2 > 0 && Math.random() < GEAR.t2;   // Modulo 30: un tiro a inizio battaglia per tutte le torrette (nessun tiro senza il Modulo)
}
// Moduli 29 e 30: l’entità parte dal livello 2; i potenziamenti restano 12 e i level up 3 (il primo la lascia al 2) [deciso, § 15]
function fromLv2(s) { s.level = 2; s.lv2 = true; return s; }
function newTurret(id, i) { const s = makeShooter(TURRETS[id], SLOT_X[i], GROUND_Y - 14); return turretsLv2 ? fromLv2(s) : s; }
const curDiff = () => diffOf(campLevel, mode === "epic");
const living = () => enemies.filter((e) => !e.dead && e.y >= 0);
const randEnemy = () => { const l = living(); return l.length ? l[Math.floor(Math.random() * l.length)] : null; };
const N = (s, id) => s.up[id] || 0;
const has = (s, id) => (s.up[id] || 0) > 0;
// carte standard potenziate dall’albero: s.sb = livello del nodo per carta (preso in makeShooter, fisso per la partita)
const SB = (s, id) => (s.sb && s.sb[id]) || 0;

const stdR = (s, id, f) => 1 - (1 - f) * (1 + STD_BOOST.reduce * SB(s, id));       // fattore della ricarica per pila

function makeShooter(def, x, y) {
  const sb = {}; for (const u of def.ups) if (u.cat === "std") sb[u.id] = treeLv(def.id + ":std:" + u.id);
  // tb: danno del tipo e di tutte le torrette dall’albero (solo torrette)
  // e dall’equipaggiamento: statistica base del nucleo, Moduli 23-28 (si sommano a quelli dell’albero)
  const tb = def.id === "player" ? 1 : 1 + TREE_VAL.typeDmg * treeLv("types:dmg:" + def.type) + TREE_VAL.allDmg * treeLv("types:all") + GEAR.tdmg + (GEAR.type[def.type] || 0);

/* =====================================================================
   STATI, DANNO, EFFETTI GENERICI
   ===================================================================== */
const debuffed = (e) => e.slowT > 0 || e.weakT > 0 || e.vulnT > 0 || e.burnT > 0 || e.paraT > 0;
let statDur = 1;                                // durata degli stati delle torrette (albero, sezione per tipo)
const slow = (e, t) => { e.slowT = Math.max(e.slowT, t * statDur); };
// resistenza agli stati (statRes, solo boss): riduce l’intensità; resistenza ai knockback (kbRes). I boss sono immuni a paralisi, attrazione e teletrasporto.
const burn = (e, t, dps) => { e.burnT = Math.max(e.burnT, t * statDur); e.burnDps = Math.max(e.burnDps, dps * (1 - (e.statRes || 0))); };
const weaken = (e, t, k) => { k = k || 0.35; e.weakK = e.weakT > 0 ? Math.max(e.weakK || 0.35, k) : k; e.weakT = Math.max(e.weakT, t * statDur); };   // k: −35% di base, Congelante di più
const para = (e, t) => { if (e.boss) return; e.paraT = Math.max(e.paraT, t * statDur); };
function vuln(e, t, type) {
  if (e.vulnT > 0 && e.vulnType === "all") type = "all";
  e.vulnT = Math.max(e.vulnT, t * statDur); e.vulnType = type;
}
function knock(e, k) { if (k) e.y = Math.max(-e.def.r, e.y - k * (1 - (e.kbRes || 0))); }

function popup(e, v, mult) {
  if (floaters.length >= 60) return;
  floaters.push({
    x: e.x + rnd(-5, 5), y: e.y - e.def.r, life: 0.7,
    txt: String(Math.max(1, Math.round(v))) + (mult > 1 ? "!" : ""),
    color: mult > 1 ? "#ffd166" : mult < 1 ? "#7f8ba3" : "#e8eefc",
  });
}
// ignore = ignora le resistenze del nemico (Laser, Raggi penetranti)
function damage(e, base, type, quiet, src, ignore) {
  let mult = RESIST[e.def.type][type];
  if (ignore && mult < 1) mult = 1;
  if (type === "fire" && e.fireVulnT > 0) mult *= 1.3;              // Scia combustibile (Firewheel)
  if (e.vulnT > 0 && (e.vulnType === "all" || e.vulnType === type)) mult *= 1 + 0.25 * (1 - (e.statRes || 0));
  if (e.fieldT > 0 && src !== "disr") mult *= e.fieldAmp;
  const d = base * mult;
  e.hp -= d; e.flash = 0.06;
  if (e.hp <= 0 && !e.dead) { e.dead = true; onDeath(e); }
  if (quiet) {                       // danno continuo: un numero ogni tanto
    e.acc += d;
    if (e.accT > 0) return;
    e.accT = 0.45; popup(e, e.acc, mult); e.acc = 0;
  } else popup(e, d, mult);
}

// effetti alla morte di un nemico (tutte le morti passano da damage)
function onDeath(e) {
  if (e.burnT > 0 && e.skyBurnT > 0 && e.skyBurnS && has(e.skyBurnS, "burn3")) { const s = e.skyBurnS, x = e.x, y = e.y; later(0.05, () => skyCombust(s, x, y)); }
}

// ---- entità temporanee: ognuna ha update(dt), draw() e dead; under = disegnata sotto i nemici ----
const spawnEnt = (o) => { ents.push(o); return o; };
function later(sec, fn) { spawnEnt({ t: sec, dead: false, draw() {}, update(dt) { this.t -= dt; if (this.t <= 0) { this.dead = true; fn(); } } }); }
function ring(x, y, r1, color, life) {
  spawnEnt({ t: life, dead: false,
    update(dt) { this.t -= dt; if (this.t <= 0) this.dead = true; },
    draw() { FX.ring(this, x, y, r1, color, life); } });
}
function zigzag(x1, y1, x2, y2, amp) {
  const d = Math.hypot(x2 - x1, y2 - y1), n = Math.max(2, Math.round(d / 18)), pts = [{ x: x1, y: y1 }];
  for (let i = 1; i < n; i++) pts.push({ x: x1 + (x2 - x1) * i / n + rnd(-amp, amp), y: y1 + (y2 - y1) * i / n + rnd(-amp, amp) });
  pts.push({ x: x2, y: y2 }); return pts;
}
function bolt(pts, color, life, w) {
  spawnEnt({ t: life, dead: false,
    update(dt) { this.t -= dt; if (this.t <= 0) this.dead = true; },
    draw() { FX.bolt(this, pts, color, life, w); } });
}
// look = disegno proprio in FX (es. "teslaOrb"); altrimenti cerchio colorato
function zone(x, y, r, life, apply, color, look) {
  return spawnEnt({ x, y, r, t: life, age: 0, dead: false,
    update(dt) { this.t -= dt; this.age += dt; if (this.t <= 0) { this.dead = true; return; }
      for (const e of living()) if (dist(e.x, e.y, this.x, this.y) <= this.r + e.def.r) apply(e, dt); },
    draw() { if (look) FX[look](this); else FX.zone(this, color); } });

// ---- raggi: tracciamento con rimbalzi sui bordi dello schermo ----
// un tratto che parte fuori dalla cupola e la rientra si ferma sul suo bordo e il raggio non rimbalza più
// (il primo tratto parte da dentro ed esce normalmente: una retta non rientra in un’ellisse da cui è uscita)
function domeEntry(x, y, dx, dy) {               // distanza lungo la direzione a cui si entra nella cupola, o Infinity
  const ux = (x - DOME.cx) / DOME.rx, uy = (y - DOME.cy) / DOME.ry, vx = dx / DOME.rx, vy = dy / DOME.ry;
  const a = vx * vx + vy * vy, b = 2 * (ux * vx + uy * vy), c = ux * ux + uy * uy - 1;
  if (c <= 0) return Infinity;                   // parte da dentro (o dal bordo): esce normalmente
  const d = b * b - 4 * a * c; if (d < 0) return Infinity;
  const t = (-b - Math.sqrt(d)) / (2 * a);
  return t > 0 ? t : Infinity;
}
function trace(x, y, a, bounces) {
  const segs = []; let dx = Math.cos(a), dy = Math.sin(a), len = 0;
  for (let i = 0; i <= bounces && len < 1800; i++) {
    const tx = dx > 1e-6 ? (W - x) / dx : dx < -1e-6 ? -x / dx : Infinity;
    const ty = dy > 1e-6 ? (GROUND_Y - y) / dy : dy < -1e-6 ? -y / dy : Infinity;
    const t = Math.min(tx, ty);
    if (!isFinite(t) || t < 0.5) break;
    const td = domeEntry(x, y, dx, dy);
    if (td <= t) { segs.push({ x1: x, y1: y, x2: x + dx * td, y2: y + dy * td, dome: true }); break; }   // rientra nella cupola: si ferma
    const nx = x + dx * t, ny = y + dy * t;
    segs.push({ x1: x, y1: y, x2: nx, y2: ny }); len += t;
    if (tx <= ty) dx = -dx; else dy = -dy;
    x = nx; y = ny;

}
function segDist(px, py, s) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - s.x1) * dx + (py - s.y1) * dy) / l2, 0, 1) : 0;
  return Math.hypot(px - (s.x1 + t * dx), py - (s.y1 + t * dy));
}
const hitSegs = (e, segs, w) => segs.some((s) => segDist(e.x, e.y, s) <= e.def.r + w / 2);

// ---- bersagli ----
// Il targeting sta tutto qui: aggiungere una modalità = aggiungere un caso.
function pickTargets(pos, range, n) {
  const c = [];
  for (const e of enemies) {
    if (e.dead || e.y < 0) continue;
    const d2 = (e.x - pos.x) ** 2 + (e.y - pos.y) ** 2;
    if (d2 > (range + e.def.r) ** 2) continue;
    c.push({ e, s: settings.targeting === "highest" ? -e.hp : d2 });
  }
  c.sort((a, b) => a.s - b.s);
  return c.slice(0, n).map((x) => x.e);
}
function nearestTo(x, y, maxD, exclude) {
  let best = null, bd = maxD;
  for (const e of living()) { if (exclude && exclude.has(e)) continue; const d = dist(e.x, e.y, x, y); if (d < bd) { bd = d; best = e; } }
  return best;
}

/* =====================================================================
   TORRETTE — ogni fire(s) restituisce true se ha sparato
   ===================================================================== */

// ---------- 1. SKY GUARD (fire) ----------
function skyStats(s) {
  return { dmg: 24 * dmgM(s) * (has(s, "impact") ? 1.8 : 1) * Math.pow(stdM(s, "msl", 0.85), N(s, "msl")),
           rad: 30 * (1 + stdB(s, "rad", 0.3) * N(s, "rad")) };
}
function skyFire(s) {
  const list = living().filter((e) => dist(e.x, e.y, s.x, s.y) <= rangeOf(s) + e.def.r);
  if (!list.length) return false;
  const cnt = skyCount(s);
  for (let k = 0; k < cnt; k++) missile(s, s.x + (k - (cnt - 1) / 2) * 6, s.y - 10, false, list[Math.floor(Math.random() * list.length)]);
  return true;
}

// ---------- 2. LASER (energy) ----------

// ---------- 3. DISRUPTION DRONE (force) ----------

    update(dt) {

}

function disrBlast(y, hh, d) {               // Esplosione finale: tutto il campo, a fine durata

    draw() { FX.disrBlast(this, y, hh); } });

  if (moved) { ring(e.x, Math.max(e.y, 4), e.def.r + 8, TYPES.force.color, 0.3); if (has(s, "tp3")) damage(e, e.hp * 0.2, "force", false, "disr"); }

// ---------- 4. AEROBLAST (physical) ----------
function aeroStats(s) {
  return { dmg: 24 * dmgM(s) * Math.pow(stdM(s, "proj", 0.85), N(s, "proj")), rad: 40 * (has(s, "blast") ? 1.4 : 1), knock: has(s, "knock") ? 30 : 14 };
}
function aeroFire(s) {
  const pos = { x: s.x, y: s.y - 8 }, cnt = 2 + N(s, "proj");
  const list = pickTargets(pos, rangeOf(s), cnt);
  if (!list.length) return false;

    const t = list[k % list.length], ft = dist(t.x, t.y, pos.x, pos.y) / 260;
    const tx = clamp(t.x, 0, W), ty = t.y + t.curSpeed * ft;

}

  if (has(s, "mine1")) { const m = has(s, "mine2") ? 2 : 1; for (let i = 0; i < m; i++) mine(s, x + rnd(-14, 14), y + rnd(-8, 8)); }

    const t = nearestTo(x + rnd(-60, 60), y + rnd(-60, 60), 200);
    spawnEnt({ x, y, a: t ? Math.atan2(t.y - y, t.x - x) : rnd(0, 6.28), t, life: 1.2, dead: false,
      update(dt) {
        this.life -= dt; if (this.life <= 0) { this.dead = true; return; }
        if (this.t && !this.t.dead) this.a = Math.atan2(this.t.y - this.y, this.t.x - this.x);
        this.x += Math.cos(this.a) * 340 * dt; this.y += Math.sin(this.a) * 340 * dt;
        for (const e of living()) if (dist(e.x, e.y, this.x, this.y) <= e.def.r + 3) {
          damage(e, st.dmg * 0.3, "physical", false, "aero"); if (has(s, "salvoK")) knock(e, 10); this.dead = true; break;
        }

// mine (Aeroblast, combo del guardiano, Barriera minata): dalla 1.12.0 disegno e contatto doppi (16 px), esplosione sempre di 34 px [Marco];

    update(dt) {

        this.dead = true; ring(this.x, this.y, 34, TYPES.physical.color, 0.3);

// ---------- 5. THUNDERBOLT (electric) ----------
// le sfere girano avanti e indietro sul bordo della cupola, solo sull’arco visibile: x da ORB_X0 a W − ORB_X0
const ORB_X0 = 12, ORB_A = Math.PI + Math.acos((W / 2 - ORB_X0) / DOME.rx), ORB_B = 3 * Math.PI - ORB_A, ORB_L = ORB_B - ORB_A;
function orbStart(k) {                           // partenza sfalsata: stesse distanze di prima (0,5 + 0,9·k su un arco di π − 0,3), riportate sull’arco nuovo
  const u = (0.35 + 0.9 * k) * ORB_L / (Math.PI - 0.3), m = u % (2 * ORB_L);
  return m <= ORB_L ? { th: ORB_A + m, dir: 1 } : { th: ORB_A + 2 * ORB_L - m, dir: -1 };
}
function thunderTick(s, dt) {
  const cnt = 1 + N(s, "sph"), sp = s.st.sph = s.st.sph || [];
  while (sp.length < cnt) sp.push(Object.assign(orbStart(sp.length), { aura: 0 }));
  sp.length = cnt;
  for (const o of sp) {
    o.th += o.dir * 0.55 * dt;
    if (o.th > ORB_B) { o.th = ORB_B; o.dir = -1; }
    if (o.th < ORB_A) { o.th = ORB_A; o.dir = 1; }
    o.x = DOME.cx + DOME.rx * Math.cos(o.th); o.y = DOME.cy + DOME.ry * Math.sin(o.th);
    if (has(s, "aura")) {
      o.aura -= dt;
      if (o.aura <= 0) { o.aura = 0.6; for (const e of living()) if (dist(e.x, e.y, o.x, o.y) <= 60 + e.def.r) damage(e, 6 * dmgM(s), "electric", false, "thunder"); }
    }
  }
}
function thunderFire(s) {
  if (!living().length) return false;
  for (const o of s.st.sph || []) thunderBolt(s, o.x, o.y);
  return true;
}
// again = colpo in più del level up “Doppio fulmine” (non ne genera altri)
const thunderDmg = (s) => 16 * dmgM(s) * Math.pow(stdM(s, "sph", 0.85), N(s, "sph")) * (has(s, "para3") ? 1.3 : 1);

}

  if (has(s, "forkW")) weaken(e, 3);
  if (has(s, "para3")) thunderZap(s, e, dmg);
}

  for (let k = 0; k < (has(s, "fork2") ? 6 : 4); k++) {

    hit.add(e); forkHit(s, e, dmg); bolt(zigzag(e0.x, e0.y, e.x, e.y, 4), TYPES.electric.color, 0.15, 1.5);

// ---------- 6. BEAM (energy) ----------
function beamFire(s) {
  const pos = { x: s.x, y: s.y - 8 }, rng = rangeOf(s);
  const prim = pickTargets(pos, rng, has(s, "second") ? 2 : 1);
  if (!prim.length) return false;
  const dur = 1.8 * (1 + stdB(s, "dur", 0.3) * N(s, "dur")), dps = 24 * dmgM(s) * (has(s, "pace") ? 1.4 : 1);
  const forks = has(s, "fork1") ? 2 + (has(s, "forkN") ? 1 : 0) : 0, pull = has(s, "pull"), boom = has(s, "forkX");
  // Raggio amplificato: il danno sul bersaglio principale sale del 70% al secondo fino al massimo (×2, ×4 al lv3)
  const ampMax = has(s, "amp3") ? 4 : has(s, "amp1") ? 2 : 1, keepAmp = has(s, "amp2");
  busy(s, 1);
  spawnEnt({ t: dur, ext: 0, boomT: 0.5, amp: prim.map(() => 1), dead: false, links: [],
    update(dt) {
      this.t -= dt;
      for (let i = 0; i < prim.length; i++)

          const used = new Set(prim); prim[i] = pickTargets(pos, rng, 4).find((e) => !used.has(e)) || null;
          if (!keepAmp) this.amp[i] = 1;
        }
      const hit = new Set(), branches = []; this.links = [];
      for (const p of prim) {
        if (!p) continue;

        for (let k = 0; k < forks; k++) {
          const nx = nearestTo(p.x, p.y, 220, hit); if (!nx) break;
          hit.add(nx); this.links.push([p, nx]); branches.push([p, nx]);
        }
      }
      if (this.t <= 0 || hit.size === 0) { this.dead = true; busy(s, -1); return; }
      for (let i = 0; i < prim.length; i++) if (prim[i]) this.amp[i] = Math.min(ampMax, this.amp[i] + 0.7 * dt);
      for (const e of hit) {
        const i = prim.indexOf(e);
        const d = dps * dt * (i >= 0 ? this.amp[i] : 1) * (e.boss && has(s, "boss") ? 1.5 : 1);
        damage(e, d, "energy", true, "beam"); if (has(s, "vuln") && !e.dead) vuln(e, 2, "all");

// ---------- 7. FIREWHEEL DRONE (fire) ----------
function wheelFire(s) {

        if (this.y < 60) { this.y = 60; this.a = -this.a; } else if (this.y > GROUND_Y - 36) { this.y = GROUND_Y - 36; this.a = -this.a; }

// ---------- 8. HIVE (force) ----------
function hiveFire(s) {

  }

// colpo del drone dell’Hive: vola in 0,14 s dal drone al nemico (il danno è già applicato); con più proiettili partono sfalsati a ventaglio
function hiveShotFx(d, e, lvl, k, n) {

    update(dt) {

      const q = this.t / 0.14, tx = e.x, ty = e.y, a = Math.atan2(ty - y0, tx - x0) + off * (1 - q), L = dist(tx, ty, x0, y0);

    draw() { FX.hiveShot(this); } });
}
function waveFx(x, y, ang, len) {
  spawnEnt({ t: 0.35, dead: false,
    update(dt) { this.t -= dt; if (this.t <= 0) this.dead = true; },
    draw() { FX.hiveWave(this, x, y, ang, len); } });
}
function hiveWave(s, o, dmg, ang) {
  const len = 130 * (has(s, "waveR") ? 1.4 : 1);

    const dx = e.x - o.x, dy = e.y - o.y, d = Math.hypot(dx, dy);

    e.x = clamp(e.x + Math.cos(ang) * kk, e.def.r, W - e.def.r);              // spinta in avanti,
    e.y = Math.max(-e.def.r, e.y + Math.min(0, Math.sin(ang) * kk));          // mai verso la cupola
    if (has(s, "wave2")) slow(e, 2);

}
function hiveDrone(s, x, y, lvl, gen) {

  const dmg = 12 * dmgM(s) * Math.pow(stdM(s, "drone", 0.85), N(s, "drone"));

    fire() {

      if (!tg) return;                                    // nessun nemico a portata: non spara

}

// ---------- 9. RAILGUN (physical) ----------
function railFire(s) {
  const pos = { x: s.x, y: s.y - 10 }, t = pickTargets(pos, rangeOf(s), 1)[0];
  if (!t) return false;

    { pierce: 3 + stdC(s, "pierce", 1) * N(s, "pierce") + (has(s, "pen") ? 2 : 0), hits: 0, child: false });
  return true;
}
function railShot(s, x, y, a, st) {

  const hit = new Set();

    update(dt) {

      for (const e of living()) {

    draw() { FX.railShot(this, a); } });
}

function railBoom(s, x, y, avail, dmg0) {

// ---------- 10. TESLACOIL (electric) ----------

      this.spin += 4 * dt;

        const mv = speed * dt; this.x += Math.cos(a) * mv; this.y += Math.sin(a) * mv; this.trav += mv;
        if (this.trav >= len || this.y < 10 || this.x < 0 || this.x > W) { if (stat) this.still = statT; else return this.finish(); }
      } else { this.still -= dt; if (this.still <= 0) return this.finish(); }
      const g = has(s, "grow") ? 1 + Math.min(1, this.trav / len) : 1;     // Collasso crescente: fino a ×2 a fine percorso
      const d = (this.trav < len && this.still < 0 ? dps : statDps) * g * dt;
      for (const e of living()) {
        const dx = this.x - e.x, dy = this.y - e.y, dd = Math.hypot(dx, dy);
        if (dd > R + e.def.r) continue;
        if (!this.A && has(s, "wh1")) this.A = { x: e.x, y: e.y };
        const f = Math.min(dd, pull * g * dt); if (dd > 1 && !e.boss) { e.x += dx / dd * f; e.y += dy / dd * f; }

    finish() { this.dead = true; if (has(s, "wh1") && this.A) portals(s, this.A, { x: this.x, y: this.y }); },

}
// varchi ovali (1.12.4): buchi nel pavimento (ingresso) e nel soffitto (uscita) visti di sbieco, alti PORTAL_FLAT della larghezza;
// l’ingresso cattura chi tocca l’ovale (stessa larghezza di prima, meno profondo lungo il cammino)
const PORTAL_FLAT = 0.42;
function portals(s, A, B) {
  const rA = 22 * (has(s, "wh2") ? 1.6 : 1);
  spawnEnt({ t: has(s, "whT") ? 6 : 4, dead: false, under: true,             // buchi nel pavimento e nel soffitto: sotto i nemici
    update(dt) {
      this.t -= dt; if (this.t <= 0) { this.dead = true; return; }
      for (const e of living()) if (e.tpCd <= 0 && !e.boss && ((e.x - A.x) / (rA + e.def.r)) ** 2 + ((e.y - A.y) / (rA * PORTAL_FLAT + e.def.r)) ** 2 <= 1) {

const BEHAV = {
  sky: { fire: skyFire }, laser: { fire: laserFire }, disr: { fire: disrFire }, aero: { fire: aeroFire },
  thunder: { fire: thunderFire, tick: thunderTick, draw: thunderDraw }, beam: { fire: beamFire },
  wheel: { fire: wheelFire }, hive: { fire: hiveFire }, rail: { fire: railFire },
  tesla: { fire: teslaFire, tick: teslaTick, draw: teslaDraw }, vortex: { fire: vortexFire },
};
function runTurret(s, dt) {
  const b = BEHAV[s.id];
  if (b.tick) b.tick(s, dt);
  if (s.busy > 0) return;
  s.cd -= dt; if (s.cd > 0) return;
  if (b.fire(s)) { if (!(s.busy > 0)) s.cd = cdOf(s); } else s.cd = 0;
}

/* ---------- GUARDIANO: cadenza alta, nessun cooldown, frenesia ---------- */
// frenesia: carica in secondi [base, con la chain], durata [base, con la chain], cadenza e danno
const FRENZY = { fill: [30, 25], dur: [8, 12], rate: 1.8, rateFast: 2, dmg: 1.35 };
const frenzyDur = (p) => FRENZY.dur[has(p, "fdur") ? 1 : 0];
// guardiano: cadenza alta e danno basso per colpo; portata totale; tutti i proiettili di una salva vanno sullo stesso bersaglio
const PLAYER = { dmg: 7, interval: 0.15, range: 9999 };
// bocca del cannone del guardiano (braccio destro alzato), rispetto ai piedi: da qui partono i colpi; il clone la ha specchiata
const GUN = { dx: 7, dy: -56 };
function frenzyOn(p) { return (p.st.frenzyT || 0) > 0; }
// equipaggiamento sul guardiano: un solo bonus che somma statistica base e “+X% danni” dei Moduli (fissi, per torre, per nemico vicino, per carta scelta)
const nearBarrier = (e) => domeK(e.x, e.y, GEAR_NEAR + e.def.r) <= 1;
const gearMul = () => 1 + GEAR.pdmg + GEAR.perTower * slots.filter(Boolean).length + GEAR.perCard * runPicks
  + (GEAR.perNear ? GEAR.perNear * Math.min(10, living().filter(nearBarrier).length) : 0);
// bonus che dipendono dal nemico colpito (Moduli 6, 13, 18): si aggiungono allo stesso bonus
const gearHit = (e) => (GEAR.debuff && debuffed(e) ? GEAR.debuff : 0) + (GEAR.nearB && nearBarrier(e) ? GEAR.nearB : 0) + (GEAR.high && e.hp > 0.7 * e.maxHp ? GEAR.high : 0);
const guardDmg = (p) => PLAYER.dmg * dmgM(p) * gearMul();          // danno di riferimento del guardiano (contrattacco del Modulo 10)
function playerTick(p, dt) {
  // la frenesia scorre solo mentre si combatte: se ci sono nemici a schermo o se si sta premendo; altrimenti va in pausa
  const engaged = pressing || living().length > 0;
  if (has(p, "frenzy1")) {
    if (frenzyOn(p)) { if (engaged) { p.st.frenzyT -= dt; if (p.st.frenzyT <= 0) { p.st.frenzyT = 0; p.st.charge = 0; } } }
    else {
      p.st.charge = Math.min(1, (p.st.charge || 0) + dt / (FRENZY.fill[has(p, "fill") ? 1 : 0] + 2 * (p.frzL || 0)));   // Frenesia potenziata: +2 s per livello
      if (p.st.charge >= 1 && engaged) p.st.frenzyT = frenzyDur(p);      // parte solo se si sta combattendo
    }
  }
  p.st.paused = frenzyOn(p) && !engaged;
  p.cd -= dt; if (p.cd > 0) return;
  const cnt = 1 + N(p, "proj") + GEAR.proj, pos = { x: p.x + GUN.dx, y: GROUND_Y + GUN.dy };
  let t = null, ang = -Math.PI / 2;
  if (pressing) t = nearestTo(press.x, press.y, PRESS_PICK);   // premendo: il nemico nel mirino è il bersaglio; senza, i colpi vanno dritti in alto (−90°)
  else {
    t = pickTargets(pos, PLAYER.range, 1)[0];
    if (!t) { p.cd = 0; return; }
  }
  const f = frenzyOn(p);
  p.gm = gearMul();
  const raw = PLAYER.dmg * dmgM(p) * Math.pow(stdM(p, "proj", 0.85), N(p, "proj")) * (f ? frenzyK(p.frzL || 0) : 1) * p.gm;    // senza Colpo pesante
  const dmg0 = raw * (has(p, "punch") ? 1.6 : 1);
  const dmg = dmg0 * beamAmp(p, t);
  // combo che scattano per colpo (salva): l’effetto parte dal primo impatto del primo proiettile
  const proc = { laser: comboOn(p, "kLaser") && Math.random() < 0.03, disr: comboOn(p, "kDisr") && Math.random() < 0.10,
    aero: comboOn(p, "kAero") && Math.random() < 0.05, thunder: comboOn(p, "kThunder") && Math.random() < 0.05 };
  const any = proc.laser || proc.disr || proc.aero || proc.thunder;
  for (let k = 0; k < cnt; k++) playerBullet(p, pos.x + (k - (cnt - 1) / 2) * 7, pos.y, t, dmg, ang, k === 0 ? { proc: any ? proc : null, first: true } : null);
  const aim0 = t ? Math.atan2(t.y - pos.y, t.x - pos.x) : ang;     // direzione della salva (il clone la specchia)
  if (has(p, "fan"))                         // proiettili secondari a ventaglio, danno minore
    for (const d of fanOffsets(p)) playerBullet(p, pos.x, pos.y, null, dmg * fanK(p.fanX || 0), aim0 + d, { fan: true });   // Ventaglio potenziato: 30% → 80%
  if (comboOn(p, "kWheel") && Math.random() < 0.03) guardWheel(p);
  if (comboOn(p, "kTesla") && (p.st.shots = (p.st.shots || 0) + 1) % 40 === 0)     // Colpo caricato: ×2 (×3 in tutto con Colpo pesante)
    playerBullet(p, pos.x, pos.y, t, raw * (has(p, "punch") ? 3 : 2) * beamAmp(p, t, true), ang, { charged: N(partner("tesla"), "bounce") });
  if (comboOn(p, "kHive")) {                 // Clone speculare: specchia ogni salva del guardiano (posizione e direzione riflesse rispetto al centro),
    // anche se da quel lato non ci sono nemici; nessun bersaglio proprio; ventaglio, chain e level up sì, combo no
    const cx = W - pos.x, ca = Math.PI - aim0;        // bocca del cannone specchiata
    for (let k = 0; k < cnt; k++) playerBullet(p, cx + (k - (cnt - 1) / 2) * 7, pos.y, null, dmg0 * 0.5, ca, { clone: true });
    if (has(p, "fan")) for (const d of fanOffsets(p)) playerBullet(p, cx, pos.y, null, dmg0 * 0.5 * fanK(p.fanX || 0), ca - d, { clone: true, fan: true });
  }
  const cd0 = p.cd;
  p.cd += PLAYER.interval / (has(p, "rate3") ? 1.2 : 1) / (f ? (has(p, "fspd") ? FRENZY.rateFast : FRENZY.rate) : 1);   // += conserva il resto del fotogramma: la cadenza media è esatta
  if (GEAR.rate) p.cd -= (p.cd - cd0) * GEAR.rate;   // Modulo 7: intervallo tra le salve più breve
}
// Modulo 8: la prima salva che colpisce un nemico con uno stato ne allunga la durata, una sola volta per stato
const EXT_KEYS = ["slowT", "weakT", "vulnT", "burnT", "paraT"];
function gearExtend(e) {
  for (const k of EXT_KEYS) if (e[k] > 0 && !(e.ext && e.ext[k])) { (e.ext = e.ext || {})[k] = true; e[k] *= 1 + GEAR.ext; }
}
// Ventaglio: scarti angolari dei 4 proiettili secondari (dalla 1.12.0 l’albero ne aumenta il danno, non il numero)
function fanOffsets(p) { return [-0.6, -0.3, 0.3, 0.6]; }
// t = bersaglio da inseguire (oppure null: il colpo va dritto lungo ang); o = tipo di proiettile:
// fan = secondario del ventaglio; clone = del Clone speculare (chain e level up del guardiano sì, combo no);
// frag = frammento della combo Railgun (skip: nemici già colpiti dal proiettile da cui nasce); charged = Colpo caricato (Teslacoil: numero di rimbalzi ereditati); proc = combo da attivare al primo impatto
function playerBullet(p, x, y, t, dmg, ang, o) {
  o = o || {};
  const fan = !!o.fan, clone = !!o.clone, frag = !!o.frag, charged = o.charged != null;
  let pierce = fan || frag ? 0 : N(p, "pierce") + (has(p, "pen2") ? 2 : 0) + GEAR.pierce;
  let maxHp = !!o.first && GEAR.maxHp > 0;      // Modulo 20: un colpo per salva, sul primo nemico colpito
  let bounces = fan || frag ? 0 : (has(p, "ricochet") ? 1 : 0) + (charged ? o.charged : 0);
  const prob = fan || frag || !has(p, "boom1") ? 0 : 0.10 + (has(p, "boomP") ? 0.10 : 0) + (has(p, "boom3") ? 0.10 : 0);
  const rad = 30 * (1 + (has(p, "boom3") ? 0.3 : 0));
  const kb = fan || frag || !has(p, "punch") ? 0 : (frenzyOn(p) ? 4.5 : 1.5);   // il knockback cresce in frenesia (basso per colpo: i colpi sono molti)
  // combo per proiettile (non per il clone): danno extra da fuoco o force, frammentazione
  const fire = !clone && comboOn(p, "kSky"), force = !clone && comboOn(p, "kVortex");
  let canFrag = !clone && !fan && !frag && comboOn(p, "kRail"), proc = o.proc || null;
  // con Proiettili incendiari o Proiettili gravitazionali i colpi si alternano nei colori dei tipi attivi (fisico, fuoco, force): solo disegno
  const tints = ["physical"].concat(fire ? ["fire"] : [], force ? ["force"] : []);
  const tint = TYPES[tints.length > 1 ? tints[(p.st.tintN = (p.st.tintN || 0) + 1) % tints.length] : "physical"].color;
  const l = t ? (dist(t.x, t.y, x, y) || 1) : 1;
  spawnEnt({ x, y, vx: t ? (t.x - x) / l : Math.cos(ang), vy: t ? (t.y - y) / l : Math.sin(ang),
    t: t || null, life: fan || frag ? 0.7 : 6, hit: new Set(o.skip || []), reb: false, out: false, dead: false,
    update(dt) {
      this.life -= dt; if (this.life <= 0) { this.dead = true; return; }
      if (this.t && !this.t.dead) { const d = dist(this.t.x, this.t.y, this.x, this.y) || 1; this.vx = (this.t.x - this.x) / d; this.vy = (this.t.y - this.y) / d; }
      this.x += this.vx * 600 * dt; this.y += this.vy * 600 * dt;
      if (this.reb) {                            // dopo un rimbalzo il colpo non attraversa la cupola: se la rientra si ferma sul bordo
        if (domeK(this.x, this.y, 0) > 1) this.out = true; else if (this.out) { this.dead = true; return; }
      }
      for (const e of living()) {
        if (this.hit.has(e) || dist(e.x, e.y, this.x, this.y) > e.def.r + 3) continue;
        if (GEAR.ext) gearExtend(e);
        const dmg1 = dmg;                          // Moduli 6, 13, 18 (bonus sul nemico colpito) e critico (1); senza equipaggiamento dmg non cambia
        { const gm = p.gm || 1, gh = gearHit(e), cr = GEAR.crit && Math.random() < GEAR.crit; if (gh || cr) dmg = dmg1 * (gm + gh) / gm * (cr ? 1.5 : 1); }
        this.hit.add(e); damage(e, dmg, "physical", false, "player"); knock(e, kb);
        dmg = dmg1;
        if (maxHp && !e.dead) { maxHp = false; damage(e, Math.min(GEAR.maxHp * e.maxHp, 2 * dmg), "physical", true, "player"); }
        if (fire) damage(e, dmg * 0.2, "fire", true, "player");
        if (force) damage(e, dmg * 0.2, "force", true, "player");
        if (proc) { guardProc(p, proc, e); proc = null; }
        if (canFrag && Math.random() < 0.10) { canFrag = false; guardFrag(p, this, dmg); }
        if (prob && Math.random() < prob) {
          for (const f of living()) if (f !== e && dist(f.x, f.y, e.x, e.y) <= rad + f.def.r) damage(f, dmg * 0.7 * (1 + GEAR.explo), "physical", false, "player");   // Modulo 19
          ring(e.x, e.y, rad, TYPES.physical.color, 0.3);
        }
        if (pierce > 0) { pierce--; this.t = null; }
        else if (bounces > 0) {
          const nx = nearestTo(this.x, this.y, 180, this.hit);
          if (nx) { bounces--; this.t = nx; this.reb = true; this.out = domeK(this.x, this.y, 0) > 1; this.life = Math.max(this.life, 1.5); } else this.dead = true;
        } else this.dead = true;
        break;
      }
      if (this.y < -20 || this.y > H + 20 || this.x < -20 || this.x > W + 20) this.dead = true;
    },
    draw() { FX.guardBullet(this, charged, clone, fan, frag, tint); } });
}

/* ---------- COMBO DEL GUARDIANO (una per torretta; valori provvisori, DESIGN.md § 10) ---------- */
const COMBO_OF = Object.fromEntries(PLAYER_DEF.ups.filter((u) => u.cat === "combo").map((u) => [u.id, u.needs]));
const comboOn = (p, id) => has(p, id) && !!partner(COMBO_OF[id]);
// Mira amplificata (Beam): sullo stesso bersaglio il danno sale fino a +50% in 2 s; cambiando bersaglio si azzera
function beamAmp(p, t, peek) {
  if (!comboOn(p, "kBeam")) return 1;
  if (!peek && (!t || t !== p.st.ampE)) { p.st.ampE = t || null; p.st.ampSince = clock; }
  return t && t === p.st.ampE ? 1 + 0.5 * Math.min(1, (clock - p.st.ampSince) / 2) : 1;
}
// effetti al primo impatto di una salva: laser rotante, stack di distruzione, mina, ramificazione elettrica
function guardProc(p, proc, e) {
  if (proc.laser) laserSpin(partner("laser"), p, e);
  if (proc.disr && !e.dead) { const s = partner("disr"); destruction(s, e, disrDmg(s)); }
  if (proc.aero) {
    const list = (p.st.mines = (p.st.mines || []).filter((m) => !m.dead));
    if (list.length < 5) { const m = mine(partner("aero"), e.x, e.y); if (m) list.push(m); }
  }
  if (proc.thunder) thunderFork(partner("thunder"), e);
}
// Proiettili frammentati (Railgun): due frammenti al 50% del danno verso i nemici vicini (altrimenti a ±20°)
function guardFrag(p, b, dmg) {
  const a = Math.atan2(b.vy, b.vx), skip = new Set(b.hit);
  for (const k of [-1, 1]) {
    const nx = nearestTo(b.x, b.y, 200, skip); if (nx) skip.add(nx);
    playerBullet(p, b.x, b.y, nx, dmg * 0.5, a + k * 0.35, { frag: true, skip: b.hit });
  }
}
// Mini-drone di scorta (Firewheel): uguale ai mini-droni della torretta, uno alla volta, al massimo 3 insieme; non ferma la ricarica della torretta
function guardWheel(p) {
  const list = (p.st.minis = (p.st.minis || []).filter((m) => !m.dead));
  if (list.length >= 3) return;
  const s = partner("wheel");
  list.push(wheelDrone(s, p.x, GROUND_Y - 44, rnd(-2.6, -0.5), Object.assign(wheelMini(s), { free: true })));
}
// Laser rotante (Laser): centrato sul bersaglio (lo segue finché vive), 2 giri in 3 s; eredita danno, debuff e mini-raggi, non i rimbalzi
function laserSpin(s, p, e) {
  if (p.st.spin && !p.st.spin.dead) return;                 // uno alla volta
  const half = 55, w = 8 * (has(s, "wide") ? 2 : 1), dbMul = has(s, "debuffdur") ? 1.5 : 1, ign = new Map();
  const rays = [{ off: 0, dps: 20 * dmgM(s), w }];
  if (has(s, "multi1")) for (const k of [-1, 1]) rays.push({ off: k * Math.PI / 3, dps: 20 * dmgM(s) * (has(s, "multiD") ? 0.7 : 0.4), w: w * 0.6 });
  p.st.spin = spawnEnt({ x: e.x, y: e.y, t: 0, e, dead: false,
    segs(r) { const a = this.t * 4 * Math.PI / 3 + r.off, c = Math.cos(a) * half, sn = Math.sin(a) * half;
      return [{ x1: this.x - c, y1: this.y - sn, x2: this.x + c, y2: this.y + sn }]; },
    update(dt) {
      this.t += dt; if (this.t >= 3) { this.dead = true; return; }
      if (this.e && !this.e.dead) { this.x = this.e.x; this.y = this.e.y; } else this.e = null;
      for (const r of rays) { const sg = this.segs(r); for (const f of living()) if (hitSegs(f, sg, r.w)) laserHit(s, f, r.dps * dt, dbMul, true, ign); }
    },
    draw() { FX.laserSpin(this, rays); } });
}

/* =====================================================================
   MOTORE DEI POTENZIAMENTI
   ===================================================================== */
const maxedCount = () => [player, ...slots].filter((t) => t && t.done).length;
function eligible(s) {
  const ups = s.def.ups, out = [], cap = towerCap();
  if (s.done) return out;
  if (s.used >= 3) {      // serve un level up per procedere
    if (cap < 3 && s.level >= cap) return out;                       // livello successivo non ancora sbloccato
    for (const u of ups) if (u.cat === "lu" && u.lv <= s.level && !has(s, u.id) && !locked(s.id, u.id)) out.push(u);
    return out;
  }
  for (const u of ups) {
    if (locked(s.id, u.id)) continue;                                 // carta dell’albero dei Sigilli non ancora sbloccata
    if (u.cat === "std") { if (N(s, u.id) < 3) out.push(u); }
    else if (u.cat === "chain") {
      if (has(s, u.id) || u.lv > s.level) continue;                   // le chain lv2/lv3 solo se la torre è al livello 2/3
      if (u.lv === 1 || ups.some((v) => v.cat === "chain" && v.chain === u.chain && v.lv === u.lv - 1 && has(s, v.id))) out.push(u);
    } else if (u.cat === "combo") {
      if (!has(s, u.id) && (u.lv || 1) <= s.level && comboReady(u)) out.push(u);
    }
  }
  return out;
}
// la torretta della combo è in campo e soddisfa la condizione (livello raggiunto o voce chain scelta)
const partner = (id) => slots.find((t) => t && t.id === id) || null;
function comboReady(u) {
  const t = partner(u.needs);
  return !!t && (typeof u.cond === "number" ? t.level >= u.cond : has(t, u.cond) && !locked(t.id, u.cond));
}
function applyUp(s, u) {
  s.up[u.id] = N(s, u.id) + 1;
  if (u.cat === "lu") { if (s.lv2) { s.lv2 = false; s.used = 0; } else if (s.level < 3) { s.level++; s.used = 0; } else s.done = true; }   // lv2: partito dal livello 2, il primo level up lo lascia al 2
  else s.used++;
  if (player && slots) markTop();
}

let cardsN = 3;                                  // carte offerte dopo l’ondata (4 con il Modulo 22)
function rollOptions(n) {
  n = n || cardsN;
  const cands = [], owned = slots.filter(Boolean);
  if (slots.indexOf(null) >= 0)
    for (const id of TURRET_ORDER)
      if (!owned.some((s) => s.id === id)) cands.push({ w: owned.length < 2 ? 3 : 1.5, opt: { kind: "new", id } });
  for (const who of [player, ...owned])
    for (const u of eligible(who)) cands.push({ w: UP_W[u.cat], opt: { kind: "up", who, up: u } });
  const out = [];
  while (out.length < n && cands.length) {
    let r = Math.random() * cands.reduce((a, c) => a + c.w, 0), i = 0;
    while (i < cands.length - 1 && (r -= cands[i].w) > 0) i++;
    out.push(cands.splice(i, 1)[0].opt);
  }
  return out;
}

const CAT_LABEL = { std: "Standard", chain: "Chain", lu: "Level up", combo: "Combo" };
function describe(opt) {
  if (opt.kind === "new") {
    const d = TURRETS[opt.id];
    return { head: "Nuova torretta · " + TYPES[d.type].name, title: d.name, desc: d.blurb, note: "Si piazza nel primo slot libero", type: d.type };
  }
  const s = opt.who, u = opt.up, d = s.def;
  let note;
  if (u.cat === "std") note = "Pila " + (N(s, u.id) + 1) + "/3 · livello " + s.level + " (" + (s.used + 1) + "/3)";
  else if (u.cat === "chain") note = "Chain lv " + u.lv + " · livello " + s.level + " (" + (s.used + 1) + "/3)";

function toLogical(e) {

function setPress(p) { press.x = p.x; press.y = Math.min(p.y, GROUND_Y - 50); }
const inBtn = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const stopDrag = () => { dragging = false; pressing = false; };
cv.addEventListener("pointerup", (e) => {
  stopDrag(); guideDrag = null;
  const c = cardPress; cardPress = null;

  const b = buttons.find((o) => o.release && o.x === c.x && o.y === c.y && o.w === c.w && o.h === c.h);

window.addEventListener("keydown", (e) => {
  if (!document.getElementById("splash").hidden) return;              // schermata iniziale: il gioco non parte finché non si entra
  const k = e.key.toLowerCase();

  if (state === "tree") { if (k === "escape") closeTree(); return; }   // mentre si scrive nel pannello i tasti non comandano il gioco
  if (state === "gear") { if (k === "escape") closeGear(); return; }
  if (state === "levels") { if (k === "escape") closeLevels(); else if (k === "enter") playLevel(); return; }
  if (state === "guide") { if (k === "escape") closeGuide(); return; }
  if (state === "upgrade" && (k === "b" || k === "tab")) { e.preventDefault(); upBuild = !upBuild; return; }
  if (state === "upgrade" && upBuild) { if (k === "escape" || k === "enter") upBuild = false; return; }
  if (state === "menu" && (k === "arrowleft" || k === "arrowright" || k === "a" || k === "d"))
    selLevel = clamp(selLevel + (k === "arrowright" || k === "d" ? 1 : -1), 1, maxSelectable());
  if (k === "arrowleft" || k === "a") keys.left = 1;
  else if (k === "arrowright" || k === "d") keys.right = 1;
  else if ((k === "p" || k === "escape") && state === "play") pauseGame();
  else if ((k === "p" || k === "escape" || k === "enter" || k === " ") && state === "pause") resumeGame();
  else if (k === "tab" && state === "pause") { e.preventDefault(); pauseTab = pauseTab === "enemies" ? "build" : "enemies"; }
  else if (k === "t" && (state === "play" || state === "upgrade")) toggleTargeting();
  else if (state === "upgrade" && rewards && (k === "enter" || k === " " || k === "1")) pick(0);
  else if (state === "upgrade" && (k === "1" || k === "2" || k === "3" || k === "4")) pick(+k - 1);
  else if (state === "upgrade" && k === "r") refreshCards();
  else if (state === "menu" && (k === "enter" || k === " ")) startRun("standard");
  else if (state === "menu" && k === "e") { if (epicUnlocked()) startRun("epic"); }
  else if (state === "won" && unlockNotes.length && (k === "enter" || k === " " || k === "escape")) closeUnlocks();   // prima si chiude l’avviso
  else if (state === "won" && unlockNotes.length) return;
  else if (state === "won" && (k === "enter" || k === " ")) nextOrRetry();

/* =====================================================================
   SALVATAGGIO: esporta e importa progressi e impostazioni
   File (JSON leggibile) oppure codice di testo "FD1:…" da copiare e incollare.
   ===================================================================== */
const APP_VERSION = "1.12.4";
const SAVE_GAME = "fortress-defense", SAVE_VERSION = 4, CODE_PREFIX = "FD1:";   // 2: Sigilli, premi, nodi dell’albero, torrette equipaggiate · 3: equipaggiamento · 4: Sigilli maggiori
const $id = (id) => document.getElementById(id);
function makeSave() {
  return { game: SAVE_GAME, version: SAVE_VERSION, appVersion: APP_VERSION, exportedAt: new Date().toISOString(),
    progress: { cleared: progress.cleared, seen: [...progress.seen], seals: progress.seals, majors: progress.majors, claims: [...progress.claims], tree: { ...progress.tree }, loadout: [...progress.loadout], abilities: progress.abilities && { ...progress.abilities }, gear: JSON.parse(JSON.stringify(progress.gear)) },
    settings: { targeting: settings.targeting } };
}
const makeCode = () => CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(makeSave()))));
function parseSave(text) {                      // controlla tutto prima di toccare i progressi
  let t = String(text || "").trim();
  if (!t) throw new Error("Non c’è niente da importare.");
  const isCode = t.startsWith(CODE_PREFIX);
  if (isCode) {
    try { t = decodeURIComponent(escape(atob(t.slice(CODE_PREFIX.length).replace(/\s+/g, "")))); }
    catch (e) { throw new Error("Il codice non è valido o è incompleto."); }
  }
  let d;
  try { d = JSON.parse(t); } catch (e) { throw new Error(isCode ? "Il codice non è valido o è incompleto." : "Non è un salvataggio leggibile."); }

  const p = d.progress || {}, s = d.settings || {};
  if (!Number.isFinite(p.cleared)) throw new Error("Il salvataggio non contiene i livelli completati.");

    cleared: clamp(Math.floor(p.cleared), 0, CAMPAIGN.maxLevel),
    seen: Array.isArray(p.seen) ? [...new Set(p.seen.filter((k) => typeof k === "string" && k.length < 40 && k !== "ship" && k !== "mothership"))].slice(0, 50) : [],
    ...cleanSeals(p),                            // versione 1: niente Sigilli, si parte da zero
    gear: cleanGear(p),                          // versioni 1 e 2: niente equipaggiamento, inventario vuoto
    targeting: s.targeting === "highest" ? "highest" : "closest",
    exportedAt: typeof d.exportedAt === "string" && !isNaN(Date.parse(d.exportedAt)) ? d.exportedAt : null,
  };
}
function applySave(d) {
  progress.cleared = d.cleared; progress.seen = d.seen;
  progress.seals = d.seals; progress.majors = d.majors; progress.claims = d.claims; progress.tree = d.tree; progress.loadout = d.loadout; progress.abilities = d.abilities; progress.gear = d.gear;
  settings.targeting = d.targeting;            // un eventuale "aim" dei file vecchi è ignorato
  saveProgress(); saveSettings(); selLevel = maxSelectable();

let pendingSave = null;
const gearItems = (g) => gearCount(g, "pcs") + gearCount(g, "mods") + Object.values(g.eq).reduce((a, e) => a + 1 + e.m.length, 0);
const sealsLabel = (p) => p.seals + (p.seals === 1 ? " Sigillo" : " Sigilli") + ", " + p.majors + (p.majors === 1 ? " Sigillo maggiore" : " Sigilli maggiori") + ", " + Object.keys(p.tree).length + " nodi dell’albero e " + gearItems(p.gear) + " oggetti dell’equipaggiamento";
function refreshSavePanel(msg, isErr) {
  $id("saveInfo").textContent = "Ora: " + progress.cleared + " livelli completati · " + progress.seen.length + " nemici scoperti · " + sealsLabel(progress);
  $id("confirmBox").hidden = !pendingSave;
  if (pendingSave) {
    const when = pendingSave.exportedAt ? " del " + new Date(pendingSave.exportedAt).toLocaleDateString("it-IT") : "";
    $id("confirmText").textContent = "Il salvataggio" + when + " ha " + pendingSave.cleared + " livelli completati e " + pendingSave.seen.length +
      " nemici scoperti, " + sealsLabel(pendingSave) + ". Sostituisce i progressi attuali (" + progress.cleared + " livelli, " + progress.seen.length + " nemici, " + sealsLabel(progress) + ").";

  catch (e) { pendingSave = null; refreshSavePanel(e.message, true); }
}
function openSave() { state = "save"; pendingSave = null; $id("codeBox").value = ""; refreshSavePanel(); $id("savePanel").hidden = false; }

$id("btnExport").addEventListener("click", async () => {
  const json = JSON.stringify(makeSave(), null, 2), name = "fortress-salvataggio-" + new Date().toISOString().slice(0, 10) + ".json";
  try {                                          // sul telefono: foglio di condivisione (File, Drive, mail…)

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);

<script>
/* SCHERMATA INIZIALE E AGGIORNAMENTI
   Installabile e giocabile offline: il service worker funziona solo in HTTPS (o su localhost).
   All’avvio, se online, chiede al browser se c’è un nuovo sw.js (attesa massima CHECK_MS). Se c’è: “Aggiornamento in corso…”,
   la versione nuova scarica i file, si attiva e la pagina si ricarica. Poi (o subito: niente di nuovo, offline, tempo scaduto,
   ricarico già fatto) compare “Start” e si entra nel gioco con un tocco. Il ricarico avviene solo qui, mai durante una partita. */
(() => {
  const CHECK_MS = 3000;          // attesa massima del controllo (provvisorio)
  const UPDATE_MS = 20000;        // se lo scaricamento si blocca, dopo questo tempo si gioca con la versione attuale (provvisorio)
  const RELOAD_KEY = "fortress-update-reload";
  const splash = document.getElementById("splash"), msg = document.getElementById("splashMsg");
  let ready = false, updating = false, reloading = false;

  function showStart() {
    if (ready || reloading) return;
    ready = true; splash.classList.add("ready"); msg.textContent = "Start";
  }
  function enter() { if (!ready || splash.hidden) return; splash.hidden = true; keepAwake(true); }
  splash.addEventListener("click", enter);

  // SCHERMO SEMPRE ACCESO (Screen Wake Lock): richiesto dopo il tocco su “Start” (serve un gesto), rilasciato quando la pagina
  // va in secondo piano e richiesto di nuovo al ritorno. Se il browser non lo supporta, o rifiuta, il gioco va avanti uguale.
  const wake = { want: false, lock: null, asking: false };
  async function keepAwake(start) {
    if (start) wake.want = true;
    if (!wake.want || wake.lock || wake.asking || document.hidden) return;
    try {
      if (!navigator.wakeLock || !navigator.wakeLock.request) return;
      wake.asking = true;
      const l = await navigator.wakeLock.request("screen");
      if (document.hidden) { l.release().catch(() => {}); return; }      // nel frattempo è andata in secondo piano
      wake.lock = l;
      l.addEventListener && l.addEventListener("release", () => { if (wake.lock === l) wake.lock = null; });
    } catch (e) { /* non supportato o rifiutato: nessun errore */ }
    finally { wake.asking = false; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { const l = wake.lock; wake.lock = null; if (l) try { l.release().catch(() => {}); } catch (e) {} }
    else keepAwake();
  });
  window.addEventListener("keydown", (e) => { if (!splash.hidden && (e.key === "Enter" || e.key === " ")) enter(); });

  let reloaded = false;
  try { reloaded = sessionStorage.getItem(RELOAD_KEY) === "1"; sessionStorage.removeItem(RELOAD_KEY); } catch (e) {}

  const swOk = "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1");

  const sw = navigator.serviceWorker;
  const hadController = !!sw.controller;          // senza controller è la prima installazione: nulla da aggiornare
  const reg = sw.register("sw.js");
  if (reloaded || !hadController || navigator.onLine === false) { reg.catch(() => {}); showStart(); return; }

  const timer = setTimeout(() => { if (!updating) showStart(); }, CHECK_MS);
  function reload() {
    if (ready || reloading) return;               // “Start” già mostrato: si tiene la versione attuale fino al prossimo avvio
    reloading = true;
    try { sessionStorage.setItem(RELOAD_KEY, "1"); } catch (e) {}

  }
  function applyUpdate(worker) {
    if (!worker || updating || ready) return;

    msg.textContent = "Aggiornamento in corso…";
    const giveUp = setTimeout(showStart, UPDATE_MS);
    const step = () => {
      if (worker.state === "installed") worker.postMessage({ type: "skipWaiting" });   // versione in attesa: attivala
      else if (worker.state === "activated") { clearTimeout(giveUp); reload(); }
      else if (worker.state === "redundant") { clearTimeout(giveUp); showStart(); }     // installazione fallita
    };
    worker.addEventListener("statechange", step);
    sw.addEventListener("controllerchange", () => { clearTimeout(giveUp); reload(); });
    step();
  }
  reg.then(async (r) => {
    if (r.waiting) return applyUpdate(r.waiting);          // già scaricata in un avvio precedente, in attesa
    if (r.installing) return applyUpdate(r.installing);    // il browser la sta già scaricando
    r.addEventListener("updatefound", () => applyUpdate(r.installing));
    await r.update();
    if (r.installing || r.waiting) applyUpdate(r.installing || r.waiting);
    else if (!updating) { clearTimeout(timer); showStart(); }
  }).catch(() => { if (!updating) { clearTimeout(timer); showStart(); } });
})();
