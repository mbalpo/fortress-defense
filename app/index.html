<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b16">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planet">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Planet Defense</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #070b16; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block; background: #0b1224;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* schermata Salvataggio: pannello HTML sopra il gioco (servono veri pulsanti per file, condivisione e appunti) */
  .panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(7,11,22,0.72); z-index: 5; }
  .panel[hidden] { display: none; }
  .card { width: 100%; max-width: 340px; max-height: 100%; overflow-y: auto; background: #101a33; border: 1px solid #2c4272; border-radius: 14px; padding: 16px; color: #e8eefc; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card h2 { margin: 0 0 4px; font-size: 19px; }
  .card .info { margin: 0 0 12px; color: #9fb4d9; font-size: 13px; }
  .card .sub { margin: 14px 0 6px; color: #9fb4d9; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .card button, .card .btn { display: block; width: 100%; box-sizing: border-box; margin: 0 0 8px; padding: 11px 12px; border-radius: 9px; border: 1.5px solid #2c4272; background: #13213f; color: #e8eefc; font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; cursor: pointer; }
  .card .row2 { display: flex; gap: 8px; }
  .card .row2 > * { flex: 1; }
  .card .primary { border-color: #3fe0a0; }
  .card .warn { border-color: #ff7a3d; }
  .card .ghost { background: transparent; color: #9fb4d9; margin-top: 6px; }
  .card textarea { display: block; width: 100%; box-sizing: border-box; margin: 0 0 8px; padding: 9px; border-radius: 9px; border: 1.5px solid #2c4272; background: #0b1224; color: #e8eefc; font: 12px/1.35 ui-monospace, Menlo, monospace; resize: vertical; }
  .card .confirm { margin: 10px 0 4px; padding: 10px; border-radius: 9px; background: rgba(255,122,61,0.12); border: 1px solid #ff7a3d; }
  .card .confirm p { margin: 0 0 10px; font-size: 13px; }
  .card .msg { min-height: 18px; margin: 6px 0 0; color: #3fe0a0; font-size: 13px; }
  .card .msg.err { color: #ff8a8a; }
  /* schermata iniziale: copre il gioco finché non si tocca “Start” (intanto controlla gli aggiornamenti) */
  #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    padding: 24px; background: #070b16; color: #e8eefc; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #splash[hidden] { display: none; }
  #splash h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: .04em; text-align: center; }
  #splash img { width: min(62vw, 36vh, 260px); height: auto; border-radius: 22%; }
  #splashMsg { min-height: 40px; margin: 0; display: flex; align-items: center; color: #9fb4d9; font-size: 16px; font-weight: 600; }
  #splash.ready { cursor: pointer; }
  #splash.ready #splashMsg { color: #3fe0a0; font-size: 26px; font-weight: 800; letter-spacing: .06em; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Campo di battaglia"></canvas>
<script src="audio.js"></script>
<script src="draw-hd2d.js"></script>
<script src="draw.js"></script>
<div id="splash" role="button" aria-label="Planet Defense">
  <h1>PLANET DEFENSE</h1>
  <img src="icon-512.png" alt="" width="512" height="512">
  <p id="splashMsg" role="status"></p>
</div>
<div id="savePanel" class="panel" hidden>
  <div class="card" role="dialog" aria-labelledby="saveTitle">
    <h2 id="saveTitle">Salvataggio</h2>
    <p id="saveInfo" class="info"></p>
    <p class="sub">Esporta</p>
    <div class="row2"><button id="btnExport" class="primary">File</button><button id="btnCopy">Copia codice</button></div>
    <p class="sub">Importa</p>
    <label class="btn" for="fileImport">Scegli un file di salvataggio</label>
    <input type="file" id="fileImport" accept=".json,application/json,text/plain" hidden>
    <textarea id="codeBox" rows="3" placeholder="Oppure incolla qui un codice di salvataggio"></textarea>
    <button id="btnPaste">Importa il codice incollato</button>
    <div id="confirmBox" class="confirm" hidden>
      <p id="confirmText"></p>
      <div class="row2"><button id="btnConfirm" class="warn">Sostituisci</button><button id="btnCancel">Annulla</button></div>
    </div>
    <p id="saveMsg" class="msg" role="status"></p>
    <button id="btnClose" class="ghost">Chiudi</button>
  </div>
</div>
<script>
"use strict";
(() => {
const W = 360, H = 640;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
// DISEGNO: sta in draw.js (condiviso con il catalogo grafico). Si valuta qui, dentro l’ambito del gioco, così vede lo stato.
const DRAW = eval("(" + FORTRESS_DRAW + ")")();
const { draw, FX, thunderDraw, teslaDraw } = DRAW;

/* =====================================================================
   DATI — tipi di danno, nemici, ondate. I numeri sono segnaposto.
   ===================================================================== */
const TYPES = {
  force:    { name: "Force",    color: "#b07cff" },
  energy:   { name: "Energy",   color: "#3fe0ff" },
  electric: { name: "Electric", color: "#ffe14d" },
  fire:     { name: "Fire",     color: "#ff7a3d" },
  physical: { name: "Physical", color: "#d5dce8" },
};
// RESIST[tipo nemico][tipo danno] = moltiplicatore sul danno
const RESIST = {
  force:    { force: 0.5, energy: 1,   electric: 1.5, fire: 1,   physical: 1   },
  energy:   { force: 1,   energy: 0.5, electric: 1,   fire: 1.5, physical: 1   },
  electric: { force: 1,   energy: 1,   electric: 0.5, fire: 1,   physical: 1.5 },
  fire:     { force: 1.5, energy: 1,   electric: 1,   fire: 0.5, physical: 1   },
  physical: { force: 1,   energy: 1.5, electric: 1,   fire: 1,   physical: 0.5 },
};

// dmg = danno alla cupola a ogni attacco (ogni ATTACK_EVERY secondi, a contatto)
const ATTACK_EVERY = 1.2;
const ENEMY_DEFS = {
  drone:   { type: "electric", hp: 30,  speed: 50, r: 11, dmg: 2,   look: "saucer"   },   // navicella
  wisp:    { type: "energy",   hp: 22,  speed: 60, r: 9,  dmg: 1.5, look: "shard"    },   // cristallo-cometa
  brute:   { type: "force",    hp: 140, speed: 28, r: 16, dmg: 6,   look: "asteroid" },   // asteroide
  spitter: { type: "fire",     hp: 60,  speed: 42, r: 13, dmg: 3,   look: "meteor"   },   // meteora infuocata
  shell:   { type: "physical", hp: 60,  speed: 34, r: 14, dmg: 4,   look: "rock"     },   // frammento roccioso
};
const N_WAVES = 20;

/* =====================================================================
   CAMPAGNA
   ===================================================================== */
const CAMPAIGN = {
  maxLevel: 200,                           // campagna lunga: almeno 200 livelli (Marco)
  towerCaps: [[0, 1], [10, 2], [20, 3]],   // [livelli completati, livello massimo delle torri]
  bossFrom: 11, bossWaves: [5, 10, 15],    // mini-boss dal livello 11 (dopo il 10), a queste ondate
  bossCards: 3,                            // carte a caso ricevute (e applicate subito) per ogni mini-boss sconfitto
  finalBossEvery: 10,                      // ai livelli multipli di 10 l’ondata 20 finisce con un boss finale
  smallUntil: 10,                          // fino a questa difficoltà solo nemici "piccoli"
  epicUnlock: 50, epicOffset: 30,          // Epica: difficoltà = livello + 30
  equipUnlock: 30, barrierUnlock: 40,      // equipaggiamento (DESIGN.md § 15) e abilità della barriera (§ 16)
  sealsFrom: 31, sealsStandard: 1, sealsEpic: 2,   // Sigilli: dal livello 31 in Standard (1), da subito in Epica (2, dalla 1.15.1; prima 3); DESIGN.md § 16
};
const UP_W = { std: 1, chain: 0.4, combo: 0.4, lu: 2 };   // chain e combo escono meno degli standard
const diffOf = (lv, epic) => lv + (epic ? CAMPAIGN.epicOffset : 0);
// Scalatura per difficoltà D (livello standard, o livello+30 in Epica). Tarata solo fino a D≈30.
const LV = { hp0: 0.42, hpSlope: 0.08, hpSlopeHi: 0.02, dmg: 0.01, speed: 0.002, count: 0.005 };
// fino a D=10 la vita sale in fretta (da nemici deboli al "muro"); dopo sale piano, perché le scelte per partita non crescono
// difficoltà effettiva: tra il 20 e il 30 sale piano (la potenza del giocatore è ferma fino al boss del 30); dal 31 sale di 0,2 per livello,
// tarata con i bot che spendono i Sigilli attesi nell’albero (1,5 per livello dal 31) perché i livelli tra un muro e l’altro restino intorno al 60-80%
const EFF_SLOPE_31 = 1.2, EFF_JUMP_31 = 3;   // 1.12.0: pendenza 1,2 e scalino di 3 dal 31 (1.11.0: 0,8 e 2), con albero, equipaggiamento e un po’ di Epica attesi (muri dal 40 al 50-70%)
const effD = (D) => D <= 20 ? D : D <= 30 ? 20 + 0.3 * (D - 20) : 23 + EFF_JUMP_31 + EFF_SLOPE_31 * (D - 30);
const levelHp    = (D) => { D = effD(D); return D <= 10 ? LV.hp0 + LV.hpSlope * (D - 1) : LV.hp0 + LV.hpSlope * 9 + LV.hpSlopeHi * (D - 10); };
const levelDmg   = (D) => 1 + LV.dmg * (effD(D) - 1);
const levelSpeed = (D) => 1 + LV.speed * (effD(D) - 1);
const levelCount = (D) => 1 + LV.count * (effD(D) - 1);

function waveSpec(n, D) {
  const small = D <= CAMPAIGN.smallUntil;
  const kinds = small ? ["drone", "wisp", "spitter", "shell"] : ["drone", "wisp", "spitter", "shell", "brute"];
  const L = kinds.length, a = kinds[(n - 1) % L], b = kinds[small ? (n * 3 + 1) % L : (n * 2 + 1) % L];
  const size = (k, base) => Math.max(2, Math.round(base * levelCount(D) * (k === "brute" ? 0.3 : k === "wisp" ? 1.3 : 1)));
  const every = Math.max(0.6, 1.5 - 0.035 * n);
  const ca = size(a, 3 + n * 0.7), cb = n < 3 ? 0 : size(b, 1 + n * 0.4);
  return { groups: [
    { enemy: a, count: ca, every, at: 0 },
    { enemy: b, count: cb, every: every * 1.2, at: ca * every * 0.5 },
  ]};
}
const TYPE_KEYS = ["fire", "energy", "electric", "force", "physical"];
/* ---------- NEMICI DELLA PROTEZIONE PLANETARIA (DESIGN.md § 17, fase 3) ----------
   Quattro per tipo, solo del tipo del continente: leggero, medio, pesante e lo speciale; ognuno resiste al proprio tipo in modo diverso (selfRes, tra il 25 e il 60% [deciso]),
   le altre resistenze e debolezze come la tabella RESIST del tipo. Valori [Claude, provvisorio]; speciali: fire kamikaze, force invisibile, electric scatto, energy immune, physical guscio. */
const PLANET_FOE = {
  l: { hp: 36,  speed: 60, r: 10, dmg: 1.5, selfRes: 0.25, look: "dart" },   // leggero: veloce e fragile
  m: { hp: 60,  speed: 42, r: 13, dmg: 3,   selfRes: 0.4,  look: "gem" },    // medio
  p: { hp: 132, speed: 28, r: 16, dmg: 6,   selfRes: 0.6,  look: "tank" },   // pesante: lento e corazzato
  s: { hp: 72,  speed: 40, r: 14, dmg: 4,   selfRes: 0.5 },                  // speciale
};
const PLANET_SPECIAL = { fire: ["bomb", "kami"], force: ["wraith", "invis"], electric: ["spark", "dash"], energy: ["prism", "immune"], physical: ["crab", "husk"] };
ENEMY_DEFS.force_w = { type: "force", planet: true, hp: 30, speed: 75, r: 10, dmg: 2, selfRes: 0.3, look: "wing" };   // alati della nave madre (fase 4) [Claude, provvisorio]
for (const t of TYPE_KEYS) for (const v of ["l", "m", "p", "s"]) {
  const d = Object.assign({ type: t, planet: true }, PLANET_FOE[v]);
  if (v === "s") Object.assign(d, { look: PLANET_SPECIAL[t][0], special: PLANET_SPECIAL[t][1] });
  ENEMY_DEFS[t + "_" + v] = d;
}
// valori degli speciali [Claude, provvisorio]: X e Y del § 17
const SPECIAL = {
  invisAt: 0.3,                 // force: invisibile dopo aver perso il 30% della vita
  dashAt: 0.4, dashPx: 120, dashT: 0.3,   // electric: dopo aver perso il 40% scatta in basso di 120 px in 0,3 s, una volta
  immEvery: 6, immFor: 2,       // energy: ogni 6 s è immune ai danni (anche da stato) per 2 s
  husk: 4,                      // physical: guscio invincibile per 4 s
  kamiK: 4,                     // fire: alla cupola danno × (1 + 4 × vita rimasta ÷ vita massima), poi muore
};
// torrette che colpiscono gli invisibili (oltre agli effetti ad area) [deciso]; il guardiano solo con la conversione energy
const SEE_INVIS = ["laser", "beam", "disr", "vortex", "wheel"];
// ondate della Protezione planetaria: le stesse quantità della campagna, con il nemico del continente della stessa taglia; speciali dall’ondata 3
// (1 + uno ogni 5 ondate, ogni 3 s) [Claude, provvisorio]
const PLANET_SIZE = { drone: "l", wisp: "l", spitter: "m", shell: "m", brute: "p" };
const bossDef = (lv, n) => ({ type: TYPE_KEYS[(lv + n / 5) % 5], hp: 480, speed: 20, r: 24, dmg: 9, boss: true, look: "ship",
  kbRes: 0.4 + 0.1 * ((lv * 7 + n / 5) % 5), statRes: 0.25 + 0.1 * ((lv * 3 + n / 5) % 4) });   // resistenze variabili: spinte 40-80%, stati 25-55%
/* ---------- MINI-BOSS MAGGIORI (1.23.0, DESIGN.md § 17) ----------
   Cinque abilità, ognuna in tutti i tipi [deciso, Marco]: il tipo segue bossDef (a rotazione; nei continenti quello del continente), l’abilità è indipendente.
   Campagna, per difficoltà (uguale in Standard ed Epica): dalla 70 l’ondata 15, dalla 85 la 10 e la 15, dalla 100 tutte e tre. Protezione planetaria per livello
   del continente: 3-4 la 15, 5-6 la 10 e la 15, dal 7 tutte. Vita, velocità e danno della nave aliena [Claude, provvisorio]; aspetto in draw.js (FOE_LAYERS). */
const MAJOR_DEF = {
  split:   { name: "Asteroide maggiore", look: "mrock",  r: 26, ab: "Scissione",    txt: "Scissione: a metà vita si divide, fino a 4 pezzi" },
  adapt:   { name: "Cristallo maggiore", look: "mshard", r: 24, ab: "Adattamento",  txt: "Adattamento: ogni 10% di vita persa cambia resistenza" },
  regen:   { name: "Artiglio maggiore",  look: "mclaw",  r: 26, ab: "Incremento",   txt: "Incremento: ogni 2 s rigenera fino a 4 nemici" },
  invis:   { name: "Prisma maggiore",    look: "mprism", r: 24, ab: "Invisibilità", txt: "Invisibile a −30% di vita; raggio da lontano" },
  deflect: { name: "Riflesso maggiore",  look: "mirror", r: 24, ab: "Deviazione",   txt: "Deviazione: metà del danno va agli altri nemici" },
};
const MAJOR_KEYS = Object.keys(MAJOR_DEF);
const MAJ = {
  from: [[100, [5, 10, 15]], [85, [10, 15]], [70, [15]]],                         // campagna: difficoltà → ondate con il maggiore [deciso]
  planet: (L) => (L >= 7 ? [5, 10, 15] : L >= 5 ? [10, 15] : L >= 3 ? [15] : []),   // Protezione planetaria [deciso]; quali ondate nei livelli 3-6 [Claude]
  splits: 2, splitDmg: 0.6, splitR: 0.72,   // Scissione: 2 generazioni (4 pezzi), danno ×0,6 a ogni scissione [deciso]; raggio dei pezzi ×0,72 [Claude]
  adaptStep: 0.1, adaptMax: 9,              // Adattamento: ogni 10% di vita persa, al massimo 9 cambi [deciso]
  regenEvery: 2, regenN: 4,                 // Incremento: ogni 2 s, fino a 4 nemici [deciso]
  regenCamp: 0.25,                           // Incremento nella campagna: quota del danno al secondo del guardiano (ritarato, 1.23.1; nei continenti resta 1) [Marco: solo la campagna]
  invisAt: 0.3, invisT: 10, stopAt: 0.75,   // Invisibilità: a −30% di vita, per 10 s; si ferma con il bordo inferiore al 25% dal basso [deciso]
  deflect: 0.5, orbEvery: 0.4, orbT: 0.7,   // Deviazione: 50% del danno, una sfera ogni 0,4 s [deciso]; volo della sfera 0,7 s [Claude]
};
function majorWaves() {                     // ondate dei mini-boss maggiori nel livello in corso
  if (mode === "planet") return MAJ.planet(campLevel);
  const D = curDiff(), r = MAJ.from.find(([d]) => D >= d); return r ? r[1] : [];
}
// quale maggiore [Claude, da rivedere]: con k = ondata ÷ 5 il tipo è (lv + k) % 5 (bossDef) e l’abilità (lv + ⌊lv ÷ 5⌋ + k) % 5: abilità diverse nello stesso livello,
// e la differenza tra abilità e tipo cambia ogni 5 livelli, così in 25 livelli di fila escono tutte le 25 combinazioni (nei continenti tutte le abilità del tipo)
const majorOf = (lv, n) => MAJOR_KEYS[(lv + Math.floor(lv / 5) + n / 5) % 5];
function miniDef(lv, n) {                   // mini-boss dell’ondata n: nave aliena o maggiore
  const d = bossDef(lv, n); if (mode === "planet") d.type = planetType;
  if (!majorWaves().includes(n)) return d;
  const ab = majorOf(lv, n), M = MAJOR_DEF[ab];
  return Object.assign(d, { major: ab, look: M.look, name: M.name, r: M.r, gl: mode === "planet" ? campLevel : campGiantLv(curDiff()),   // gl: livello del raggio, come i giganti
    split: ab === "split" ? MAJ.splits : 0, stopAt: ab === "invis" ? H * MAJ.stopAt : 0 });
}
// vita base del boss finale, tarata con i bot perché i muri si superino circa nel 30% delle partite (scelta di Marco):
// 10, 20, 30 sul pool libero; dal 40 con l’albero atteso e le abilità della barriera, 1450 × (1 + 1,5 · n^0,35) con n = decine dopo il 40 (cresce in fretta all’inizio, poi piano)
const FINAL_BOSS_HP = { 10: 400, 20: 2250, 30: 1450 };
// fattore per singolo muro (1.11.0): corregge i muri che con l’equipaggiamento atteso uscivano dalla fascia 50-70% [Claude, provvisorio]
// 50: ×0,6 (1.14.0, Marco) con i maggiori della barriera, che al 50 non si hanno ancora (insieme a WALL_ENEMY_HP[50])
const FINAL_BOSS_K = { 40: 1.2, 50: 0.6, 60: 0.6, 80: 1.3, 90: 0.6, 100: 0.65, 120: 1.15, 130: 1.15, 170: 1.5, 190: 0.75 };
const finalBossHp = (lv) => FINAL_BOSS_HP[lv] || FINAL_BOSS_HP[30] * (1 + 1.5 * Math.pow(Math.max(0, lv / 10 - 4), 0.35)) * (FINAL_BOSS_K[lv] || 1);
// vita dei nemici normali nei livelli muro (oltre al boss): il 10 e il 50 (1.14.0, Marco), dove si muore anche prima del boss
const WALL_ENEMY_HP = { 10: 0.93, 50: 0.85 };
const finalBossDef = (lv) => ({ type: TYPE_KEYS[(lv / 10) % 5], hp: finalBossHp(lv), speed: 14, r: 34, dmg: 8, boss: true, final: true, look: "mothership", kbRes: 0.85, statRes: 0.6 });   // vita che cresce con il livello
const hasMiniBosses = () => mode === "epic" || mode === "planet" || campLevel >= CAMPAIGN.bossFrom;   // in Epica e nella Protezione planetaria fin dal livello 1
const hasFinalBoss = () => mode !== "planet" && campLevel % CAMPAIGN.finalBossEvery === 0;   // Protezione planetaria: boss in ogni livello, dall’ondata 18 (planetWave)
const waveHp    = (n) => 1 + 0.09 * (n - 1);
const waveSpeed = (n) => 1 + 0.012 * (n - 1);
const waveDmg   = (n) => 1 + 0.04 * (n - 1);
const MODES = { standard: { label: "Standard" }, epic: { label: "Epica" }, planet: { label: "Protezione" } };

/* ---------- PROTEZIONE PLANETARIA (DESIGN.md § 17, fase 1) ----------
   Terza modalità: 5 continenti, uno per tipo, ognuno con la propria scala di livelli; ondate sovrapposte con un tempo per ondata,
   scelte in coda, boss dall’ondata 18 (conta come ondata 20), al massimo 2 partite al giorno, frammenti dei ranger come ricompensa.
   [deciso] le regole (Marco); [provvisorio] difficoltà, tempi delle ondate, nemici e boss segnaposto, F. */
const PLANET = {
  unlock: 60, perDay: 2, dayBonus: 2,                          // [deciso]; ×2 [provvisorio]
  order: ["fire", "force", "electric", "energy", "physical"],   // griglia 2 + 2 + 1: Europa, Africa / Asia, Americhe / Oceania [deciso]
  land: { fire: "Europa", force: "Africa", electric: "Asia", energy: "Americhe", physical: "Oceania" },
  week: [null, "physical", "force", "energy", "electric", "fire", null],   // domenica … sabato; sabato e domenica a caso (seme = data) [deciso]
  F: 10,                                                       // frammenti di una partita piena al livello 1 [Claude, provvisorio] (crescita con la scala: da misurare)
  diff: (L) => 55 + 5 * L,                                     // difficoltà: livello 1 = 60, +5 per livello [Claude, provvisorio]
  bossAt: 18,                                                  // il boss compare all’ondata 18 e conta come ondata 20 [deciso]
  // tempo stimato di ogni ondata (s), dalla sua partenza alla successiva: mediana del tempo di pulizia dei bot con albero ed equipaggiamento attesi,
  // ondate in sequenza, livelli 1 e 5, tutti i tipi (tests/tools/planet.js, SEQ=1; 1.16.0). L’ondata 20 vale come la 19 (serve solo alla velocità del boss) [Claude]
  waveT: [8, 11, 18, 21, 23, 18, 20, 23, 22, 22, 22, 24, 25, 24, 21, 25, 27, 26, 24, 24],
  waveK: 1,                                                    // fattore su tutti i tempi, per le prove

   ===================================================================== */

        this.x += (this.t.x - this.x) / d * mv; this.y += (this.t.y - this.y) / d * mv;
        return;
      }
      this.cd -= dt; this.rt -= dt;
      if (!this.t || this.t.dead || (settings.targeting === "highest" && this.rt <= 0)) { this.t = hiveTarget(s, this); this.rt = 1; }
      if (this.t) {                                       // si avvicina finché è a portata, poi si ferma
        const d = edist(this.t, this.x, this.y);
        if (d > HIVE_STOP) { const mv = Math.min(d - HIVE_STOP, 150 * dt); this.x += (this.t.x - this.x) / d * mv; this.y += (this.t.y - this.y) / d * mv; }
      }
      if (this.cd <= 0) this.fire();
      if (this.shots >= this.cap) {
        if (has(s, "stay") && !this.stayed && Math.random() < 0.3) { this.stayed = true; this.cap = this.shots + cap0; }
        else if (has(s, "kami")) { this.kami = 3; this.t = nearestTo(this.x, this.y, 900); }
        else this.die();
      }
    },
    draw() { FX.hiveDrone(this); if (this.spark) FX.hiveSparks(this); if (this.ray && !this.ray.e.dead) FX.hiveBeam(this, this.ray.e); } });
  list.push(d0);
  return d0;
}

// ---------- 9. RAILGUN (physical) ----------
function railFire(s) {
  const pos = { x: s.x, y: s.y - 10 }, t = pickTargets(pos, rangeOf(s), 1)[0];
  if (!t) return false;
  railShot(s, pos.x, pos.y, Math.atan2(t.y - pos.y, t.x - pos.x),
    { pierce: 3 + stdC(s, "pierce", 1) * N(s, "pierce") + (has(s, "pen") ? 2 : 0), hits: 0, child: false });
  return true;
}
const railDmg = (s) => 32 * dmgM(s) * (has(s, "punch") ? 1.5 : 1);
function railShot(s, x, y, a, st) {
  const dmg0 = railDmg(s), kb = has(s, "pen") ? 28 : has(s, "punch") ? 14 : 0;
  const hit = new Set();
  // combo: Proiettili a mini-droni e a sciame (un tiro per colpito), a wormhole (un tiro per proiettile, a fine corsa, con almeno 2 colpiti)
  const kW = kOn(s, "kWheel"), kH = kOn(s, "kHive"), kV = kOn(s, "kVortex");
  spawnEnt({ x, y, dead: false, first: null, last: null, proj: true,
    end() {
      this.dead = true;
      if (kV && hit.size >= 2 && Math.random() < K_PROB) kPortals(s.id + ":kVortex", kV, this.first, this.last);
    },
    update(dt) {
      this.x += Math.cos(a) * 1000 * dt; this.y += Math.sin(a) * 1000 * dt;
      if (shells.length && shellAt(this.x, this.y)) { this.end(); return; }   // il guscio ferma il proiettile
      for (const e of living()) {
        if (hit.has(e) || e.invis || edist(e, this.x, this.y) > e.def.r + 4) continue;
        const avail = st.pierce;                         // perforazioni disponibili al momento dell’impatto
        hit.add(e); st.hits++; st.pierce--;
        const crit = has(s, "crit") && Math.random() < 0.3 ? 1.5 : 1;            // Colpo critico
        damage(e, dmg0 * crit * (has(s, "mass") ? 1 + 0.15 * (st.hits - 1) : 1), "physical", false, "rail");
        knock(e, kb); if (has(s, "vulnP")) vuln(e, 3, "physical");
        if (has(s, "stun")) para(e, 0.8);                // Impatto stordente (i boss sono immuni)
        if (!this.first) this.first = { x: e.x, y: e.y }; this.last = { x: e.x, y: e.y };
        if (kW && Math.random() < K_PROB) kMini(s.id + ":kWheel", kW, e.x, e.y);
        if (kH && Math.random() < K_PROB) kDrone(s.id + ":kHive", kH, e.x, e.y);
        // Proiettile esplosivo: il primo impatto esplode sempre; con il lv3 il colpito n° k esplode con probabilità 100% − 20% × (k − 1)
        if (has(s, "boom1") && ((st.hits === 1 && !st.child) || (st.hits > 1 && has(s, "boom3") && Math.random() < 1 - 0.2 * (st.hits - 1))))
          railBoom(s, e.x, e.y, avail, dmg0);
        if (!st.child && st.pierce > 0 && ((st.hits === 1 && has(s, "split1")) || (st.hits === 2 && has(s, "split2"))))
          railShot(s, this.x, this.y, a + (Math.random() < 0.5 ? -1 : 1) * 0.35, { pierce: st.pierce, hits: st.hits, child: true });
        if (st.pierce <= 0) { this.end(); break; }
      }
      if (!this.dead && (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20)) this.end();
    },
    draw() { FX.railShot(this, a); } });
}

function railBoom(s, x, y, avail, dmg0) {
  const rad = 30 * (has(s, "boomR") ? 1 + 0.1 * avail : 1), d = dmg0 * 0.5 * (has(s, "boomD") ? 1 + 0.15 * avail : 1);
  for (const e of living()) if (edist(e, x, y) <= rad + e.def.r) damage(e, d, "physical", false, "rail");
  ring(x, y, rad, TYPES.physical.color, 0.3); sfx("esplosione.piccola");
}

// ---------- 10. TESLACOIL (electric) ----------
// carica: 0,7 s base; la chain Sovraccarico la allunga (+0,5 / +0,5 / +1 s) e ogni 0,5 s in più fa crescere l’esplosione
const teslaChargeT = (s) => 0.7 + (has(s, "over1") ? 0.5 : 0) + (has(s, "over2") ? 0.5 : 0) + (has(s, "over3") ? 1 : 0);
const teslaExtra = (s) => (teslaChargeT(s) - 0.7) / 0.5;           // mezzi secondi di carica in più
const teslaRad = (s) => 36 * (has(s, "big") ? 1.4 : 1) * (has(s, "over1") ? 1 + 0.3 * teslaExtra(s) : 1);
// Sfera statica (anche per le combo con Firewheel Drone): area elettrica che dura 2 s (3,5 con Sfera persistente)
function teslaOrb(s, x, y, rad) {
  return zone(x, y, rad, has(s, "orbDur") ? 3.5 : 2, (e, dt) => { damage(e, 12 * dmgM(s) * (has(s, "orbD") ? 1.6 : 1) * dt, "electric", true, "tesla"); if (has(s, "orbSlow")) slow(e, 0.4); }, TYPES.electric.color, "teslaOrb");
}
function teslaFire(s) {
  if (!pickTargets({ x: s.x, y: s.y - 10 }, rangeOf(s), 1)[0]) return false;
  s.st.charge = s.st.chargeT = teslaChargeT(s); busy(s, 1); return true;
}
function teslaTick(s, dt) {
  if (!(s.st.charge > 0)) return;
  s.st.charge -= dt;
  if (has(s, "charge"))
    for (const e of living()) if (Math.abs(e.x - s.x) <= 60 && e.y < s.y && e.y > s.y - 170) damage(e, 15 * dmgM(s) * dt, "electric", true, "tesla");
  if (s.st.charge <= 0) {
    s.st.charge = 0;
    const t = pickTargets({ x: s.x, y: s.y - 10 }, rangeOf(s), 1)[0];
    if (t) teslaBall(s, s.x, s.y - 18, t, N(s, "bounce"), new Set());
    busy(s, -1);
  }
}
function teslaBall(s, x, y, target, bounces, hitSet) {
  spawnEnt({ x, y, t: target, age: 0, dead: false, proj: true,
    update(dt) {
      this.age += dt;
      if (!this.t || this.t.dead) { this.t = nearestTo(this.x, this.y, 400, hitSet); if (!this.t) { this.dead = true; return; } }
      const d = edist(this.t, this.x, this.y), mv = 420 * dt;
      if (d <= this.t.def.r + 8 + mv) { this.dead = true; teslaBoom(s, this.x, this.y, bounces, hitSet); return; }
      this.x += (this.t.x - this.x) / d * mv; this.y += (this.t.y - this.y) / d * mv;
      if (shells.length && shellAt(this.x, this.y)) { this.dead = true; teslaBoom(s, this.x, this.y, bounces, hitSet); return; }   // esplode sul guscio
      if (this.age > 6) this.dead = true;
    },
    draw() { FX.teslaBall(this); } });
}
function teslaBoom(s, x, y, bounces, hitSet) {
  const extra = teslaExtra(s);
  const dmg = 28 * dmgM(s) * Math.pow(stdM(s, "bounce", 0.85), N(s, "bounce")) * (has(s, "over2") ? 1 + 0.3 * extra : 1);
  const rad = teslaRad(s), first = [];
  for (const e of living()) if (edist(e, x, y) <= rad + e.def.r) {
    hitSet.add(e); first.push(e); damage(e, dmg, "electric", false, "tesla");
    if (has(s, "stun") && Math.random() < 0.3) para(e, 1);          // Esplosioni paralizzanti: come la paralisi del Thunderbolt
  }
  ring(x, y, rad, TYPES.electric.color, 0.3); sfx("esplosione.piccola");
  if (has(s, "chain")) {
    const near = living().filter((e) => !hitSet.has(e) && canSee(e) && edist(e, x, y) <= 100).sort((a, b) => dist(a.x, a.y, x, y) - dist(b.x, b.y, x, y)).slice(0, 5);
    for (const e of near) { hitSet.add(e); damage(e, dmg * 0.4, "electric", false, "tesla"); bolt(zigzag(x, y, e.x, e.y, 4), TYPES.electric.color, 0.15, 1.5); }
  }
  if (has(s, "orb")) teslaOrb(s, x, y, rad);
  // combo: Sfere a raggi (laser rotante), Sfere teletrasportanti (un tiro per colpito), Sfere minate (mine dell’Aeroblast, 2 con Più mine)
  const L = kOn(s, "kLaser"), D = kOn(s, "kDisr"), A = kOn(s, "kAero");
  if (L && first.length && Math.random() < K_PROB) kSpin(s.id + ":kLaser", L, first[0]);
  if (D) for (const e of first) if (!e.dead) teleportRoll(D, e);
  if (A) for (let i = 0, m = has(A, "mine2") ? 2 : 1; i < m; i++) mine(A, x + rnd(-14, 14), y + rnd(-8, 8));
  if (bounces > 0) {
    const nx = nearestTo(x, y, 170, hitSet);
    if (nx) teslaBall(s, x, y, nx, bounces - 1, hitSet);
  }
}

// ---------- 11. GRAVITY VORTEX GUN (force) ----------
function vortexFire(s) {
  // corto raggio in partenza: la portata cresce insieme al percorso del buco nero
  const pos = { x: s.x, y: s.y - 10 }, list = pickTargets(pos, vortexReach(s), 2);
  if (!list.length) return false;
  const cnt = has(s, "twin") ? 2 : 1;
  for (let k = 0; k < cnt; k++) {
    const t = list[k % list.length];
    vortex(s, pos, Math.atan2(t.y - pos.y, t.x - pos.x) + (cnt === 2 && list.length < 2 ? (k ? 0.3 : -0.3) : 0), t);
  }
  return true;
}
// percorso (revisione 3, 1.14.2): 253 px di partenza, +20% per pila di “Percorso più lungo” (3 pile = 405 px); il nodo dell’albero non lo allunga
const VORTEX_LEN0 = 253;
const vortexLen = (s) => VORTEX_LEN0 * (1 + 0.2 * N(s, "len"));
// portata di partenza: nemici entro max(portata, percorso); la stessa del raggio mostrato al tocco (0 pile 260 px · 1 304 · 2 354 · 3 405)
const vortexReach = (s) => Math.max(rangeOf(s), vortexLen(s));
// statistiche dei buchi neri di una Gravity Vortex Gun (anche quelli statici delle combo con Firewheel Drone e Aeroblast)
function vortexStats(s) {
  const dps = 12 * dmgM(s) * (has(s, "power") ? 1.5 : 1) * (1 + VLEN_DMG * SB(s, "len") * N(s, "len"));
  return { len: vortexLen(s), R: 32 * (1 + stdB(s, "rad", 0.25) * N(s, "rad")), pull: 80 * (has(s, "pull") ? 1.6 : 1), dps, speed: has(s, "lazy") ? 80 : 130,
    statT: has(s, "stat2") ? 3 : 2, statDps: dps * (has(s, "stat3") ? 1.6 : 1) };
}
// tg: il bersaglio scelto (combo Buco nero ramificato: dopo di lui il buco nero ne insegue altri)
function vortex(s, pos, a, tg) {
  const vs = vortexStats(s), R = vs.R, speed = vs.speed, stat = has(s, "stat1"), statT = vs.statT;
  // combo: Buco nero incendiario (Sky Guard), Buco nero ramificato (Beam), Buco nero paralizzante (Thunderbolt: Paralisi totale = danno +30%)
  const kS = kOn(s, "kSky"), kB = kOn(s, "kBeam"), kT = kOn(s, "kThunder");
  const pull = vs.pull * (kB && has(kB, "pull") ? 1.5 : 1), mul = kT && has(kT, "para3") ? 1.3 : 1, dps = vs.dps * mul, statDps = vs.statDps * mul;
  spawnEnt({ x: pos.x, y: pos.y, trav: 0, lim: vs.len, still: -1, A: null, dead: false, spin: 0, a, tg: kB ? tg || null : null, more: kB ? (has(kB, "forkN") ? 3 : 2) : 0,
    done: new Set(), zapped: new Set(),
    update(dt) {
      this.spin += 4 * dt;
      if (this.still < 0) {
        if (this.tg) this.steer();
        const mv = speed * dt; this.x += Math.cos(this.a) * mv; this.y += Math.sin(this.a) * mv; this.trav += mv;
        if (this.trav >= this.lim || this.y < 10 || this.x < 0 || this.x > W) { if (stat) this.still = statT; else return this.finish(); }
      } else { this.still -= dt; if (this.still <= 0) return this.finish(); }
      const len = this.lim, g = has(s, "grow") ? 1 + Math.min(1, this.trav / len) : 1;     // Collasso crescente: fino a ×2 a fine percorso
      const d = (this.trav < len && this.still < 0 ? dps : statDps) * g * dt;
      for (const e of living()) {
        const dx = this.x - e.x, dy = this.y - e.y, dd = Math.hypot(dx, dy);
        if (dd > R + e.def.r) continue;
        if (!this.A && has(s, "wh1")) this.A = { x: e.x, y: e.y };
        const f = Math.min(dd, pull * g * dt); if (dd > 1 && !e.boss) { e.x += dx / dd * f; e.y += dy / dd * f; }
        damage(e, d, "force", true, "vortex");
        if (kS && !e.dead) { skyBurn(kS, e, 3, 6 * dmgM(kS)); reveal(e); }
        if (kT && !this.zapped.has(e)) { this.zapped.add(e); thunderZap(kT, e, thunderDmg(kT)); }   // un tiro per nemico e per buco nero
      }
    },
    // Buco nero ramificato: va verso il bersaglio; raggiunto (esplosione con Base esplosiva), passa al prossimo, mai verso il basso:
    // il più vicino entro 130 px non più in basso, altrimenti il più vicino più in alto; il percorso si allunga quanto serve
    steer() {
      const t = this.tg;
      if (!t.dead && edist(t, this.x, this.y) > R + t.def.r) { this.a = Math.atan2(Math.min(0, t.y - this.y), t.x - this.x); return; }
      if (!t.dead) {
        this.done.add(t);
        if (has(kB, "forkX")) { const bd = 24 * dmgM(kB) * (has(kB, "pace") ? 1.4 : 1) * 0.5;
          for (const e of living()) if (edist(e, t.x, t.y) <= 40 + e.def.r) damage(e, bd, "energy", false, "beam");
          ring(t.x, t.y, 40, TYPES.energy.color, 0.3); sfx("esplosione.piccola"); }
      }
      this.tg = null;
      if (this.more <= 0) return;
      let best = null, bd = 130;
      for (const e of living()) { if (this.done.has(e) || e.y > this.y) continue; const d = edist(e, this.x, this.y); if (d < bd) { bd = d; best = e; } }
      if (!best) { bd = Infinity; for (const e of living()) { if (this.done.has(e) || e.y >= this.y) continue; const d = edist(e, this.x, this.y); if (d < bd) { bd = d; best = e; } } }
      if (!best) return;
      this.more--; this.tg = best; this.lim = Math.max(this.lim, this.trav + bd + R);
      this.a = Math.atan2(Math.min(0, best.y - this.y), best.x - this.x);
    },
    finish() { this.dead = true; if (has(s, "wh1") && this.A) portals(s, this.A, { x: this.x, y: this.y }); },
    draw() { FX.vortex(this, R); } });
}
// varchi ovali (1.12.4): buchi nel pavimento (ingresso) e nel soffitto (uscita) visti di sbieco, alti PORTAL_FLAT della larghezza;
// l’ingresso cattura chi tocca l’ovale (stessa larghezza di prima, meno profondo lungo il cammino)
const PORTAL_FLAT = 0.42;
function portals(s, A, B) {
  const rA = 22 * (has(s, "wh2") ? 1.6 : 1);
  return spawnEnt({ t: has(s, "whT") ? 6 : 4, A, B, dead: false, under: true,             // buchi nel pavimento e nel soffitto: sotto i nemici
    update(dt) {
      this.t -= dt; if (this.t <= 0) { this.dead = true; return; }
      for (const e of living()) if (e.tpCd <= 0 && !e.boss && ((e.x - A.x) / (rA + e.def.r)) ** 2 + ((e.y - A.y) / (rA * PORTAL_FLAT + e.def.r)) ** 2 <= 1) {
        e.x = clamp(B.x + rnd(-8, 8), 10, W - 10); e.y = Math.max(0, B.y); e.tpCd = 2;
        if (has(s, "wh3")) { slow(e, 2); reveal(e); }
      }
    },
    draw() { FX.portals(this, A, rA, B); } });
}

/* ---------- COMBO TRA DUE TORRETTE (DESIGN.md § 3 e § 10; probabilità e tetti provvisori, da misurare con i bot) ----------
   La principale prende la combo; gli effetti usano i numeri della secondaria (kOn restituisce la secondaria) e le voci della sua chain. */
const K_PROB = 0.10;          // probabilità per bersaglio, per colpo o per proiettile [Claude, provvisorio]
const K_CAP = 5;              // al massimo 5 a schermo per combo: buchi neri, droni, mini-droni, wormhole, laser rotanti, sfere statiche, scie [deciso]
// tag = "principale:combo": ogni tetto vale per la sua combo, senza contare quelli della torretta o di altre combo [Claude, da rivedere]
const kRoom = (tag) => ents.reduce((n, o) => n + (o.kc === tag && !o.dead ? 1 : 0), 0) < K_CAP;
const kTag = (o, tag) => { if (o) o.kc = tag; return o; };
// esplosione del Proiettile esplosivo (Raggi esplosivi, Fulmini esplosivi): 50% del danno della Railgun, 65% con Carica esplosiva, 80% con Esplosioni a catena;
// raggio 30 px, +10% con Deflagrazione
function kBoom(r, x, y) {
  const rad = 30 * (has(r, "boomR") ? 1.1 : 1), d = railDmg(r) * (has(r, "boom3") ? 0.8 : has(r, "boomD") ? 0.65 : 0.5);
  for (const e of living()) if (edist(e, x, y) <= rad + e.def.r) damage(e, d, "physical", false, "rail");
  ring(x, y, rad, TYPES.physical.color, 0.3); sfx("esplosione.piccola");
}
// fulmine ramificato attirato da un bersaglio (Raggio fulminante, Colpi fulminanti): parte dalla sfera del Thunderbolt più vicina, anche obliquo;
// è una ramificazione (50%, 75% e indebolimento con Ramificazioni debilitanti, paralisi con Paralisi totale); colpisce 2 volte con Ramificazione II
function kBolt(t, e) {
  const zap = () => {
    if (e.dead) return;
    let o = null, bd = Infinity; for (const q of t.st.sph || []) { const d = dist(q.x, q.y, e.x, e.y); if (d < bd) { bd = d; o = q; } }
    const x0 = o ? o.x : e.x, y0 = o ? o.y : 0;
    forkHit(t, e, thunderDmg(t)); bolt(zigzag(x0, y0, e.x, e.y, 6), TYPES.electric.color, 0.18, 2);
  };
  zap(); if (has(t, "fork2")) later(0.15, zap);
}
// drone dell’Hive nato da un colpito (Raggi a sciame, Proiettili a sciame): livello a caso fino a quello permesso da Sciame II / III; non lancia altri droni
function kDrone(tag, h, x, y) {
  if (!kRoom(tag)) return null;
  const max = has(h, "seed3") ? 3 : has(h, "seed2") ? 2 : 1;
  return kTag(hiveDrone(h, x, y, 1 + Math.floor(Math.random() * max), 1), tag);
}
// mini-drone della Firewheel nato da un colpito (Proiettili a mini-droni): come quelli della torretta, non la tiene ferma
function kMini(tag, w, x, y) {
  if (!kRoom(tag)) return null;
  return kTag(wheelDrone(w, x, y, rnd(0, 6.2832), Object.assign(wheelMini(w), { free: true })), tag);
}
// buco nero statico (Drone collassante, Colpi singolari): fermo, attrae e danneggia come quello della Gravity Vortex Gun (durata e danno della chain)
function kHole(tag, v, x, y) {
  if (!kRoom(tag)) return null;
  const vs = vortexStats(v);
  return spawnEnt({ x, y, t: vs.statT, spin: 0, dead: false, kc: tag,
    update(dt) {
      this.spin += 4 * dt; this.t -= dt; if (this.t <= 0) { this.dead = true; return; }
      for (const e of living()) {
        const dx = this.x - e.x, dy = this.y - e.y, dd = Math.hypot(dx, dy);
        if (dd > vs.R + e.def.r) continue;
        const f = Math.min(dd, vs.pull * dt); if (dd > 1 && !e.boss) { e.x += dx / dd * f; e.y += dy / dd * f; }
        damage(e, vs.statDps * dt, "force", true, "vortex");
      }
    },
    draw() { FX.vortex(this, vs.R); } });
}
// sfera statica della Teslacoil (Drone elettrostatico)
const kOrb = (tag, t, x, y) => kRoom(tag) ? kTag(teslaOrb(t, x, y, teslaRad(t)), tag) : null;
// wormhole della Gravity Vortex Gun (Proiettili a wormhole): ingresso sul primo colpito, uscita sull’ultimo
const kPortals = (tag, v, A, B) => kRoom(tag) ? kTag(portals(v, A, B), tag) : null;
// laser rotante (Esplosioni a raggi, Sfere a raggi): come quello del guardiano, ma con i raggi della chain Raggi multipli: 2 a croce
// (3 con Mini-raggi rimbalzanti), danno dei mini-raggi (40%, 70% con Mini-raggi potenziati), indebolimento con Raggi debilitanti
function kSpin(tag, L, e) {

/* ---------- PROTEZIONE PLANETARIA: ondate sovrapposte ----------
   Ogni ondata ha la sua durata (planetWaveT): allo scadere parte la successiva anche con i nemici della precedente ancora in campo.
   La scelta delle carte arriva quando tutti i nemici di un’ondata sono sconfitti; la ricompensa di un mini-boss subito; gioco e tempo in pausa durante le carte,
   scelte in coda. Il boss compare all’ondata 18 ma conta come ondata 20. Si salva quando un’ondata è ripulita. */
function planetWave(n) {
  const first = !pw.started;
  if (first) {                                     // inizio (o ripresa) della partita: come startWave
    pw.started = true; waveTime = -1.2; ents = []; queue = [];
    for (const s of [player, ...slots]) if (s) { s.st = s.id === "player" ? { charge: s.st.charge, frenzyT: s.st.frenzyT || 0 } : {}; s.busy = 0; s.cd = Math.min(s.cd, 0.8); }
    for (let k = 1; k < n; k++) pw.clr[k] = true;  // ripresa: le ondate prima di n sono già ripulite
  }

  const t0 = first ? 0 : waveTime, D = curDiff(), t = planetType;
  for (const g of waveSpec(n, D).groups)           // solo nemici del tipo del continente (1.18.0): stessa taglia del nemico della campagna
    for (let i = 0; i < g.count; i++) queue.push({ t: t0 + g.at + i * g.every, enemy: t + "_" + PLANET_SIZE[g.enemy], w: n, x: 30 + Math.random() * (W - 60) });
  if (n >= 3) for (let i = 0; i < 1 + Math.floor((n - 3) / 5); i++) queue.push({ t: t0 + 2 + i * 3, enemy: t + "_s", w: n, x: 30 + Math.random() * (W - 60) });
  if (CAMPAIGN.bossWaves.includes(n)) queue.push({ t: t0 + 3, enemy: "boss", def: miniDef(campLevel, n), w: n, x: W / 2 });   // tipo del continente; maggiori dal livello 3
  if (n === PLANET.bossAt) queue.push({ t: t0 + 2, enemy: "boss", def: planetBossDef(), w: N_WAVES, x: W / 2 });

/* ---------- BOSS DELLA PROTEZIONE PLANETARIA (DESIGN.md § 17, fase 4) ----------

   box = semilarghezza e semialtezza della sagoma (rettangolo arrotondato, edist); il meteorite è un cerchio. Valori [Claude, provvisorio]. */

  force:    { name: "Nave madre", look: "carrier", box: [60, 135] },                   // lunga il 75% dello schermo con le ali (270 px di scafo); rilascia gli alati
  electric: { name: "Disco volante", look: "disc", box: [150, 55] },                   // a volte assorbe il danno
  energy:   { name: "Prisma gigante", look: "bigprism", box: [90, 192] },              // 50% di larghezza, 60% di altezza; raggio verticale; non scende sotto il 25%

  if (state === "pause" && pauseTab === "enemies" && p.y > 96 && p.y < 578) { pauseDrag = { y: p.y, s: pauseScroll }; return; }   // trascinare scorre i nemici in pausa (non sulle torrette)
  if (state === "play") {
    beginDrag(p);                                // il guardiano segue il dito; i colpi vanno in verticale
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  }
});
let volDrag = null;
cv.addEventListener("pointermove", (e) => {
  if (volDrag) { if (state === "menu") volDrag.drag(toLogical(e)); return; }
  if (state === "guide" && guideDrag) { guideScroll = Math.max(0, guideDrag.s - (toLogical(e).y - guideDrag.y)); return; }
  if (state === "pause" && pauseDrag) { pauseScroll = Math.max(0, pauseDrag.s - (toLogical(e).y - pauseDrag.y)); return; }
  if (tapPend) {
    const p = toLogical(e); tapPend.last = p;
    if (Math.hypot(p.x - tapPend.x, p.y - tapPend.y) < RANGE_TAP.move) return;
    tapPend = null; if (state === "play") beginDrag(p);
    return;
  }
  if (!dragging || state !== "play") return;
  const p = toLogical(e); player.targetX = p.x; setPress(p);
});
function setPress(p) { press.x = p.x; press.y = Math.min(p.y, GROUND_Y - 50); }
const inBtn = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const stopDrag = () => { dragging = false; pressing = false; };
cv.addEventListener("pointerup", (e) => {
  stopDrag(); guideDrag = null; pauseDrag = null;
  if (volDrag) { volDrag = null; saveSettings(); }
  const q = tapPend; tapPend = null;
  if (q && rtime - q.t < RANGE_TAP.ms && (state === "play" || state === "pause") && slots[q.i]) rangeShow = { i: q.i, t0: rtime };   // un solo raggio: sostituisce il precedente
  const c = cardPress; cardPress = null;
  if (!c || state !== "upgrade") return;
  const p = toLogical(e);                        // vale solo se il dito finisce sulla stessa carta su cui era partito
  const b = buttons.find((o) => o.release && o.x === c.x && o.y === c.y && o.w === c.w && o.h === c.h);
  if (b && inBtn(p, b)) b.onTap();
});
cv.addEventListener("wheel", (e) => { if (state === "guide") { e.preventDefault(); guideScroll = Math.max(0, guideScroll + e.deltaY * 0.5); } }, { passive: false });
cv.addEventListener("pointercancel", () => { stopDrag(); cardPress = null; tapPend = null; if (volDrag) { volDrag = null; saveSettings(); } });
window.addEventListener("keydown", (e) => {
  if (!document.getElementById("splash").hidden) return;              // schermata iniziale: il gioco non parte finché non si entra
  const k = e.key.toLowerCase();
  if (state === "save") { if (k === "escape") closeSave(); return; }
  if (state === "tree") { if (k === "escape") closeTree(); return; }   // mentre si scrive nel pannello i tasti non comandano il gioco
  if (state === "gear") { if (k === "escape") closeGear(); return; }
  if (state === "levels") { if (k === "escape") closeLevels(); else if (k === "enter") playLevel(); return; }
  if (state === "guide") { if (k === "escape") closeGuide(); return; }
  if (state === "rangers") { if (k === "escape") closeRangers(); return; }
  if (state === "planet") { if (k === "escape") closePlanet(); else if (k >= "1" && k <= "5" && k.length === 1) startPlanet(PLANET.order[+k - 1]); return; }
  if (state === "upgrade" && (k === "b" || k === "tab")) { e.preventDefault(); upBuild = !upBuild; return; }
  if (state === "upgrade" && upBuild) { if (k === "escape" || k === "enter") upBuild = false; return; }
  if (state === "menu" && (k === "arrowleft" || k === "arrowright" || k === "a" || k === "d"))
    setSel(menuMode, selOf(menuMode) + (k === "arrowright" || k === "d" ? 1 : -1));
  if (k === "arrowleft" || k === "a") keys.left = 1;
  else if (k === "arrowright" || k === "d") keys.right = 1;
  else if ((k === "p" || k === "escape") && state === "play") pauseGame();
  else if ((k === "p" || k === "escape" || k === "enter" || k === " ") && state === "pause") resumeGame();
  else if (k === "tab" && state === "pause") { e.preventDefault(); pauseTab = pauseTab === "enemies" ? "build" : "enemies"; }
  else if (k === "t" && (state === "play" || state === "upgrade")) toggleTargeting();
  else if (state === "upgrade" && rewards && (k === "enter" || k === " " || k === "1")) pick(0);
  else if (state === "upgrade" && (k === "1" || k === "2" || k === "3" || k === "4")) pick(+k - 1);
  else if (state === "upgrade" && k === "r") refreshCards();
  else if (state === "menu" && (k === "enter" || k === " ")) startOrArm("standard");
  else if (state === "menu" && k === "e") { if (epicUnlocked()) startOrArm("epic"); }
  else if (state === "menu" && k === "c" && suspended) continueRun();
  else if (state === "won" && unlockNotes.length && (k === "enter" || k === " " || k === "escape")) closeUnlocks();   // prima si chiude l’avviso
  else if (state === "won" && unlockNotes.length) return;
  else if (state === "won" && (k === "enter" || k === " ")) nextOrRetry();
  else if (state === "lost" && (k === "enter" || k === " ")) retry();
  else if ((state === "won" || state === "lost") && k === "m") toMenu();
});
window.addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (k === "arrowleft" || k === "a") keys.left = 0;
  else if (k === "arrowright" || k === "d") keys.right = 0;
});

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = (W * scale) + "px"; cv.style.height = (H * scale) + "px";
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
window.addEventListener("resize", resize);
document.addEventListener("visibilitychange", () => { if (document.hidden) { pauseGame(); if (SOUND) SOUND.setActive(false); } });   // se cambi app, il gioco si mette in pausa (e il sonoro si sospende subito)
resize();

/* =====================================================================
   SALVATAGGIO: esporta e importa progressi e impostazioni
   File (JSON leggibile) oppure codice di testo "FD1:…" da copiare e incollare.
   ===================================================================== */
const APP_VERSION = "1.25.1";
const SAVE_GAME = "fortress-defense", SAVE_VERSION = 9, CODE_PREFIX = "FD1:";   // "fortress-defense" e "FD1:": nomi del primo nome del gioco, restano per i salvataggi già fatti (1.13.1)
// versioni: 2: Sigilli, premi, nodi dell’albero, torrette equipaggiate · 3: equipaggiamento · 4: Sigilli maggiori · 5: blocchi (gear.lock, lk)
// · 6: clearedEpic (livelli di Epica completati; dalle versioni precedenti si ricava dalle chiavi “e<N>” dei premi)
// · 7: planet (Protezione planetaria: livelli per tipo, frammenti dei ranger, partite del giorno); dalle versioni precedenti si parte da zero
// · 8: planet.eq (ranger equipaggiati); dalla versione 7 nessun ranger equipaggiato
// · 9: startCards (carta iniziale per entità, 1.22.0); dalle versioni precedenti nessuna carta scelta
const $id = (id) => document.getElementById(id);
function makeSave() {
  return { game: SAVE_GAME, version: SAVE_VERSION, appVersion: APP_VERSION, exportedAt: new Date().toISOString(),
    progress: { cleared: progress.cleared, clearedEpic: progress.clearedEpic, seen: [...progress.seen], seals: progress.seals, majors: progress.majors, claims: [...progress.claims], tree: { ...progress.tree }, loadout: [...progress.loadout], abilities: progress.abilities && { ...progress.abilities }, startCards: { ...progress.startCards }, gear: JSON.parse(JSON.stringify(progress.gear)), planet: JSON.parse(JSON.stringify(progress.planet)) },
    settings: { targeting: settings.targeting } };
}
const makeCode = () => CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(makeSave()))));
function parseSave(text) {                      // controlla tutto prima di toccare i progressi
  let t = String(text || "").trim();
  if (!t) throw new Error("Non c’è niente da importare.");
  const isCode = t.startsWith(CODE_PREFIX);
  if (isCode) {
    try { t = decodeURIComponent(escape(atob(t.slice(CODE_PREFIX.length).replace(/\s+/g, "")))); }
    catch (e) { throw new Error("Il codice non è valido o è incompleto."); }
  }
  let d;
  try { d = JSON.parse(t); } catch (e) { throw new Error(isCode ? "Il codice non è valido o è incompleto." : "Non è un salvataggio leggibile."); }
  if (!d || d.game !== SAVE_GAME) throw new Error("Non è un salvataggio di Planet Defense.");
  if (!(d.version >= 1) || d.version > SAVE_VERSION) throw new Error("Versione del salvataggio non supportata.");
  const p = d.progress || {}, s = d.settings || {};
  if (!Number.isFinite(p.cleared)) throw new Error("Il salvataggio non contiene i livelli completati.");
  return {
    cleared: clamp(Math.floor(p.cleared), 0, CAMPAIGN.maxLevel),
    clearedEpic: cleanEpic(p),                   // versioni 1-5: dalle chiavi “e<N>” dei premi riscossi
    seen: Array.isArray(p.seen) ? [...new Set(p.seen.filter((k) => typeof k === "string" && k.length < 40 && k !== "ship" && k !== "mothership"))].slice(0, 80) : [],
    ...cleanSeals(p),                            // versione 1: niente Sigilli, si parte da zero
    gear: cleanGear(p),                          // versioni 1 e 2: niente equipaggiamento, inventario vuoto
    planet: cleanPlanet(p),                      // versioni 1-6: Protezione planetaria da zero
    targeting: s.targeting === "highest" ? "highest" : "closest",
    exportedAt: typeof d.exportedAt === "string" && !isNaN(Date.parse(d.exportedAt)) ? d.exportedAt : null,
  };
}
function applySave(d) {
  progress.cleared = d.cleared; progress.clearedEpic = d.clearedEpic; progress.seen = d.seen;
  progress.seals = d.seals; progress.majors = d.majors; progress.claims = d.claims; progress.tree = d.tree; progress.loadout = d.loadout; progress.abilities = d.abilities; progress.startCards = d.startCards; progress.gear = d.gear; progress.planet = d.planet;
  settings.targeting = d.targeting;            // un eventuale "aim" dei file vecchi è ignorato
  saveProgress(); saveSettings(); selLevel = maxSelectable(); selEpic = maxSelectable("epic");
  clearRun();                                    // con un salvataggio importato la partita in sospeso non vale più
}
let pendingSave = null;
const gearItems = (g) => gearCount(g, "pcs") + gearCount(g, "mods") + Object.values(g.eq).reduce((a, e) => a + 1 + e.m.length, 0);
const sealsLabel = (p) => p.seals + (p.seals === 1 ? " Sigillo" : " Sigilli") + ", " + p.majors + (p.majors === 1 ? " Sigillo maggiore" : " Sigilli maggiori") + ", " + Object.keys(p.tree).length + " nodi dell’albero e " + gearItems(p.gear) + " oggetti dell’equipaggiamento";
function refreshSavePanel(msg, isErr) {
  $id("saveInfo").textContent = "Ora: " + progress.cleared + " livelli completati · " + progress.seen.length + " nemici scoperti · " + sealsLabel(progress);
  $id("confirmBox").hidden = !pendingSave;
  if (pendingSave) {
    const when = pendingSave.exportedAt ? " del " + new Date(pendingSave.exportedAt).toLocaleDateString("it-IT") : "";
    $id("confirmText").textContent = "Il salvataggio" + when + " ha " + pendingSave.cleared + " livelli completati e " + pendingSave.seen.length +
      " nemici scoperti, " + sealsLabel(pendingSave) + ". Sostituisce i progressi attuali (" + progress.cleared + " livelli, " + progress.seen.length + " nemici, " + sealsLabel(progress) + ").";
  }
  const m = $id("saveMsg"); m.textContent = msg || ""; m.classList.toggle("err", !!isErr);
}
function stageSave(text) {
  try { pendingSave = parseSave(text); refreshSavePanel(); }
  catch (e) { pendingSave = null; refreshSavePanel(e.message, true); }
}
function openSave() { state = "save"; pendingSave = null; $id("codeBox").value = ""; refreshSavePanel(); $id("savePanel").hidden = false; }
function closeSave() { $id("savePanel").hidden = true; pendingSave = null; state = "menu"; }
$id("btnExport").addEventListener("click", async () => {
  const json = JSON.stringify(makeSave(), null, 2), name = "planet-defense-salvataggio-" + new Date().toISOString().slice(0, 10) + ".json";
  try {                                          // sul telefono: foglio di condivisione (File, Drive, mail…)
    const file = new File([json], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Salvataggio Planet Defense" });
      refreshSavePanel("File pronto: " + name); return;
    }
  } catch (e) { if (e && e.name === "AbortError") { refreshSavePanel(); return; } }
  try {                                          // altrimenti: scaricamento
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    refreshSavePanel("File scaricato: " + name);
  } catch (e) { refreshSavePanel("Esportazione non riuscita: usa “Copia codice”.", true); }
});
$id("btnCopy").addEventListener("click", async () => {
  const code = makeCode();
  try { await navigator.clipboard.writeText(code); refreshSavePanel("Codice copiato: incollalo in una nota o in un messaggio per conservarlo."); }
  catch (e) { $id("codeBox").value = code; $id("codeBox").select(); refreshSavePanel("Copia il codice selezionato qui sopra."); }
});
$id("fileImport").addEventListener("change", () => {
  const f = $id("fileImport").files[0]; $id("fileImport").value = "";
  if (!f) return;
  if (f.size > 200000) { refreshSavePanel("Il file è troppo grande per essere un salvataggio.", true); return; }
  const r = new FileReader();
  r.onload = () => stageSave(r.result);
  r.onerror = () => refreshSavePanel("Impossibile leggere il file.", true);
  r.readAsText(f);
});
$id("btnPaste").addEventListener("click", () => stageSave($id("codeBox").value));
$id("btnConfirm").addEventListener("click", () => { if (!pendingSave) return; applySave(pendingSave); pendingSave = null; $id("codeBox").value = ""; refreshSavePanel("Salvataggio importato."); });
$id("btnCancel").addEventListener("click", () => { pendingSave = null; refreshSavePanel("Importazione annullata."); });
$id("btnClose").addEventListener("click", closeSave);
// chiede al browser di non cancellare i dati del gioco quando lo spazio scarseggia
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

player = makeShooter(PLAYER_DEF, W / 2, GROUND_Y - 30); player.targetX = W / 2;
slots = [null, null, null, null];
suspended = loadRun();                           // partita in sospeso (scartata se di un’altra versione o non valida)
// tipo di avvio della pagina, accanto alla versione nel menu: per capire se il sistema ha scartato l’app in background
const LAUNCH = (() => {
  try {
    if (document.wasDiscarded) return "scartata";
    const nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    return { navigate: "nuova", reload: "ricaricata", back_forward: "indietro", prerender: "prerender" }[nav && nav.type] || "";
  } catch (e) { return ""; }
})();

let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t; rtime = t; tapTick();
  if (SOUND) SOUND.setActive(state === "play" && !document.hidden);   // sospeso in pausa, nelle carte, nei menu e in secondo piano
  // velocità 1,5x e 2x: la logica avanza in passi da al massimo 0,05 s (come a 1x), così danni, collisioni e bilanciamento non cambiano;
  // anche clock è tempo di gioco (lo usano la rampa dell’Amplificatore e le animazioni). Ci si ferma appena la partita cambia stato.
  if (state === "play") {
    const total = dt * settings.speed, n = Math.max(1, Math.ceil(total / 0.05 - 1e-9));
    for (let i = 0; i < n && state === "play"; i++) { clock += total / n; update(total / n); }
  } else clock += dt;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<script>
/* SCHERMATA INIZIALE E AGGIORNAMENTI
   Installabile e giocabile offline: il service worker funziona solo in HTTPS (o su localhost).
   All’avvio, se online, chiede al browser se c’è un nuovo sw.js (attesa massima CHECK_MS). Se c’è: “Aggiornamento in corso…”,
   la versione nuova scarica i file, si attiva e la pagina si ricarica. Poi (o subito: niente di nuovo, offline, tempo scaduto,
   ricarico già fatto) compare “Start” e si entra nel gioco con un tocco. Il ricarico avviene solo qui, mai durante una partita. */
(() => {
  const CHECK_MS = 3000;          // attesa massima del controllo (provvisorio)
  const UPDATE_MS = 20000;        // se lo scaricamento si blocca, dopo questo tempo si gioca con la versione attuale (provvisorio)
  const RELOAD_KEY = "fortress-update-reload";
  const splash = document.getElementById("splash"), msg = document.getElementById("splashMsg");
  let ready = false, updating = false, reloading = false;

  function showStart() {
    if (ready || reloading) return;
    ready = true; splash.classList.add("ready"); msg.textContent = "Start";
  }
  function enter() { if (!ready || splash.hidden) return; splash.hidden = true; keepAwake(true); if (window.FORTRESS_SOUND) window.FORTRESS_SOUND.unlock(); }   // il tocco su “Start” sblocca anche il sonoro
  splash.addEventListener("click", enter);

  // SCHERMO SEMPRE ACCESO (Screen Wake Lock): richiesto dopo il tocco su “Start” (serve un gesto), rilasciato quando la pagina
  // va in secondo piano e richiesto di nuovo al ritorno. Se il browser non lo supporta, o rifiuta, il gioco va avanti uguale.
  const wake = { want: false, lock: null, asking: false };
  async function keepAwake(start) {
    if (start) wake.want = true;
    if (!wake.want || wake.lock || wake.asking || document.hidden) return;
    try {
      if (!navigator.wakeLock || !navigator.wakeLock.request) return;
      wake.asking = true;
      const l = await navigator.wakeLock.request("screen");
      if (document.hidden) { l.release().catch(() => {}); return; }      // nel frattempo è andata in secondo piano
      wake.lock = l;
      l.addEventListener && l.addEventListener("release", () => { if (wake.lock === l) wake.lock = null; });
    } catch (e) { /* non supportato o rifiutato: nessun errore */ }
    finally { wake.asking = false; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { const l = wake.lock; wake.lock = null; if (l) try { l.release().catch(() => {}); } catch (e) {} }
    else keepAwake();
  });
  window.addEventListener("keydown", (e) => { if (!splash.hidden && (e.key === "Enter" || e.key === " ")) enter(); });

  let reloaded = false;
  try { reloaded = sessionStorage.getItem(RELOAD_KEY) === "1"; sessionStorage.removeItem(RELOAD_KEY); } catch (e) {}

  const swOk = "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1");
  if (!swOk) { showStart(); return; }
  const sw = navigator.serviceWorker;
  const hadController = !!sw.controller;          // senza controller è la prima installazione: nulla da aggiornare
  const reg = sw.register("sw.js");
  if (reloaded || !hadController || navigator.onLine === false) { reg.catch(() => {}); showStart(); return; }

  const timer = setTimeout(() => { if (!updating) showStart(); }, CHECK_MS);
  function reload() {
    if (ready || reloading) return;               // “Start” già mostrato: si tiene la versione attuale fino al prossimo avvio
    reloading = true;
    try { sessionStorage.setItem(RELOAD_KEY, "1"); } catch (e) {}
    location.reload();
  }
  function applyUpdate(worker) {
    if (!worker || updating || ready) return;
    updating = true; clearTimeout(timer);
    msg.textContent = "Aggiornamento in corso…";
    const giveUp = setTimeout(showStart, UPDATE_MS);
    const step = () => {
      if (worker.state === "installed") worker.postMessage({ type: "skipWaiting" });   // versione in attesa: attivala
      else if (worker.state === "activated") { clearTimeout(giveUp); reload(); }
      else if (worker.state === "redundant") { clearTimeout(giveUp); showStart(); }     // installazione fallita
    };
    worker.addEventListener("statechange", step);
    sw.addEventListener("controllerchange", () => { clearTimeout(giveUp); reload(); });
    step();
  }
  reg.then(async (r) => {
    if (r.waiting) return applyUpdate(r.waiting);          // già scaricata in un avvio precedente, in attesa
    if (r.installing) return applyUpdate(r.installing);    // il browser la sta già scaricando
    r.addEventListener("updatefound", () => applyUpdate(r.installing));
    await r.update();
    if (r.installing || r.waiting) applyUpdate(r.installing || r.waiting);
    else if (!updating) { clearTimeout(timer); showStart(); }
  }).catch(() => { if (!updating) { clearTimeout(timer); showStart(); } });
})();
</script>
