<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b16">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fortress">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Fortress Defense</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #070b16; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block; background: #0b1224;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* schermata Salvataggio: pannello HTML sopra il gioco (servono veri pulsanti per file, condivisione e appunti) */
  .panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(7,11,22,0.72); z-index: 5; }
  .panel[hidden] { display: none; }
  .card { width: 100%; max-width: 340px; max-height: 100%; overflow-y: auto; background: #101a33; border: 1px solid #2c4272; border-radius: 14px; padding: 16px; color: #e8eefc; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card h2 { margin: 0 0 4px; font-size: 19px; }
  .card .info { margin: 0 0 12px; color: #9fb4d9; font-size: 13px; }
  .card .sub { margin: 14px 0 6px; color: #9fb4d9; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .card button, .card .btn { display: block; width: 100%; box-sizing: border-box; margin: 0 0 8px; padding: 11px 12px; border-radius: 9px; border: 1.5px solid #2c4272; background: #13213f; color: #e8eefc; font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; cursor: pointer; }
  .card .row2 { display: flex; gap: 8px; }
  .card .row2 > * { flex: 1; }
  .card .primary { border-color: #3fe0a0; }
  .card .warn { border-color: #ff7a3d; }
  .card .ghost { background: transparent; color: #9fb4d9; margin-top: 6px; }
  .card textarea { display: block; width: 100%; box-sizing: border-box; margin: 0 0 8px; padding: 9px; border-radius: 9px; border: 1.5px solid #2c4272; background: #0b1224; color: #e8eefc; font: 12px/1.35 ui-monospace, Menlo, monospace; resize: vertical; }
  .card .confirm { margin: 10px 0 4px; padding: 10px; border-radius: 9px; background: rgba(255,122,61,0.12); border: 1px solid #ff7a3d; }
  .card .confirm p { margin: 0 0 10px; font-size: 13px; }
  .card .msg { min-height: 18px; margin: 6px 0 0; color: #3fe0a0; font-size: 13px; }
  .card .msg.err { color: #ff8a8a; }
</style>
</head>
<body>
<canvas id="c" aria-label="Campo di battaglia"></canvas>
<div id="savePanel" class="panel" hidden>
  <div class="card" role="dialog" aria-labelledby="saveTitle">
    <h2 id="saveTitle">Salvataggio</h2>
    <p id="saveInfo" class="info"></p>
    <p class="sub">Esporta</p>
    <div class="row2"><button id="btnExport" class="primary">File</button><button id="btnCopy">Copia codice</button></div>
    <p class="sub">Importa</p>
    <label class="btn" for="fileImport">Scegli un file di salvataggio</label>
    <input type="file" id="fileImport" accept=".json,application/json,text/plain" hidden>
    <textarea id="codeBox" rows="3" placeholder="Oppure incolla qui un codice di salvataggio"></textarea>
    <button id="btnPaste">Importa il codice incollato</button>
    <div id="confirmBox" class="confirm" hidden>
      <p id="confirmText"></p>
      <div class="row2"><button id="btnConfirm" class="warn">Sostituisci</button><button id="btnCancel">Annulla</button></div>
    </div>
    <p id="saveMsg" class="msg" role="status"></p>
    <button id="btnClose" class="ghost">Chiudi</button>
  </div>
</div>

const LV = { hp0: 0.42, hpSlope: 0.08, hpSlopeHi: 0.02, dmg: 0.01, speed: 0.002, count: 0.005 };

const effD = (D) => D <= 20 ? D : D <= 30 ? 20 + 0.3 * (D - 20) : 23 + (D - 30);

const levelDmg   = (D) => 1 + LV.dmg * (effD(D) - 1);
const levelSpeed = (D) => 1 + LV.speed * (effD(D) - 1);
const levelCount = (D) => 1 + LV.count * (effD(D) - 1);

function waveSpec(n, D) {
  const small = D <= CAMPAIGN.smallUntil;
  const kinds = small ? ["drone", "wisp", "spitter", "shell"] : ["drone", "wisp", "spitter", "shell", "brute"];
  const L = kinds.length, a = kinds[(n - 1) % L], b = kinds[small ? (n * 3 + 1) % L : (n * 2 + 1) % L];
  const size = (k, base) => Math.max(2, Math.round(base * levelCount(D) * (k === "brute" ? 0.3 : k === "wisp" ? 1.3 : 1)));
  const every = Math.max(0.6, 1.5 - 0.035 * n);
  const ca = size(a, 3 + n * 0.7), cb = n < 3 ? 0 : size(b, 1 + n * 0.4);
  return { groups: [
    { enemy: a, count: ca, every, at: 0 },
    { enemy: b, count: cb, every: every * 1.2, at: ca * every * 0.5 },
  ]};
}

const debuffed = (e) => e.slowT > 0 || e.weakT > 0 || e.vulnT > 0 || e.burnT > 0 || e.paraT > 0;
const slow = (e, t) => { e.slowT = Math.max(e.slowT, t); };
// resistenza agli stati (statRes, solo boss): riduce l’intensità; resistenza ai knockback (kbRes). I boss sono immuni a paralisi, attrazione e teletrasporto.
const burn = (e, t, dps) => { e.burnT = Math.max(e.burnT, t); e.burnDps = Math.max(e.burnDps, dps * (1 - (e.statRes || 0))); };
const weaken = (e, t) => { e.weakT = Math.max(e.weakT, t); };
const para = (e, t) => { if (e.boss) return; e.paraT = Math.max(e.paraT, t); };
function vuln(e, t, type) {
  if (e.vulnT > 0 && e.vulnType === "all") type = "all";
  e.vulnT = Math.max(e.vulnT, t); e.vulnType = type;
}
function knock(e, k) { if (k) e.y = Math.max(-e.def.r, e.y - k * (1 - (e.kbRes || 0))); }

function popup(e, v, mult) {
  if (floaters.length >= 60) return;
  floaters.push({
    x: e.x + rnd(-5, 5), y: e.y - e.def.r, life: 0.7,
    txt: String(Math.max(1, Math.round(v))) + (mult > 1 ? "!" : ""),
    color: mult > 1 ? "#ffd166" : mult < 1 ? "#7f8ba3" : "#e8eefc",
  });
}
// ignore = ignora le resistenze del nemico (Laser, Raggi penetranti)
function damage(e, base, type, quiet, src, ignore) {
  let mult = RESIST[e.def.type][type];
  if (ignore && mult < 1) mult = 1;
  if (type === "fire" && e.fireVulnT > 0) mult *= 1.3;              // Scia combustibile (Firewheel)
  if (e.vulnT > 0 && (e.vulnType === "all" || e.vulnType === type)) mult *= 1 + 0.25 * (1 - (e.statRes || 0));
  if (e.fieldT > 0 && src !== "disr") mult *= e.fieldAmp;
  const d = base * mult;
  e.hp -= d; e.flash = 0.06;
  if (e.hp <= 0 && !e.dead) { e.dead = true; onDeath(e); }
  if (quiet) {                       // danno continuo: un numero ogni tanto
    e.acc += d;
    if (e.accT > 0) return;
    e.accT = 0.45; popup(e, e.acc, mult); e.acc = 0;
  } else popup(e, d, mult);
}

// effetti alla morte di un nemico (tutte le morti passano da damage)
function onDeath(e) {
  if (e.burnT > 0 && e.skyBurnT > 0 && e.skyBurnS && has(e.skyBurnS, "burn3")) { const s = e.skyBurnS, x = e.x, y = e.y; later(0.05, () => skyCombust(s, x, y)); }
}

// ---- entità temporanee: ognuna ha update(dt), draw() e dead ----
const spawnEnt = (o) => { ents.push(o); return o; };
function later(sec, fn) { spawnEnt({ t: sec, dead: false, draw() {}, update(dt) { this.t -= dt; if (this.t <= 0) { this.dead = true; fn(); } } }); }
function ring(x, y, r1, color, life) {
  spawnEnt({ t: life, dead: false,
    update(dt) { this.t -= dt; if (this.t <= 0) this.dead = true; },
    draw() { const k = clamp(this.t / life, 0, 1); ctx.globalAlpha = k; ctx.strokeStyle = color; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x, y, r1 * (1 - k * 0.9), 0, 6.2832); ctx.stroke(); ctx.globalAlpha = 1; } });
}
function zigzag(x1, y1, x2, y2, amp) {
  const d = Math.hypot(x2 - x1, y2 - y1), n = Math.max(2, Math.round(d / 18)), pts = [{ x: x1, y: y1 }];
  for (let i = 1; i < n; i++) pts.push({ x: x1 + (x2 - x1) * i / n + rnd(-amp, amp), y: y1 + (y2 - y1) * i / n + rnd(-amp, amp) });
  pts.push({ x: x2, y: y2 }); return pts;
}
function bolt(pts, color, life, w) {
  spawnEnt({ t: life, dead: false,
    update(dt) { this.t -= dt; if (this.t <= 0) this.dead = true; },
    draw() { ctx.globalAlpha = clamp(this.t / life, 0, 1); ctx.strokeStyle = color; ctx.lineWidth = w || 2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke(); ctx.globalAlpha = 1; } });
}
function zone(x, y, r, life, apply, color) {
  return spawnEnt({ x, y, r, t: life, dead: false,
    update(dt) { this.t -= dt; if (this.t <= 0) { this.dead = true; return; }
      for (const e of living()) if (dist(e.x, e.y, this.x, this.y) <= this.r + e.def.r) apply(e, dt); },
    draw() { ctx.globalAlpha = 0.22 * Math.min(1, this.t / 0.5); ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 0.6 * Math.min(1, this.t / 0.5); ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 1; } });
}
function glow(x1, y1, x2, y2, color, w, a) {
  ctx.lineCap = "round"; ctx.strokeStyle = color;
  ctx.globalAlpha = 0.25 * a; ctx.lineWidth = w * 2.4; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.globalAlpha = 0.95 * a; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.globalAlpha = 1;
}
function disc(x, y, r, color, a) { ctx.globalAlpha = a == null ? 1 : a; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fillStyle = color; ctx.fill(); ctx.globalAlpha = 1; }

// ---- raggi: tracciamento con rimbalzi sui bordi dello schermo ----
function trace(x, y, a, bounces) {
  const segs = []; let dx = Math.cos(a), dy = Math.sin(a), len = 0;
  for (let i = 0; i <= bounces && len < 1800; i++) {
    const tx = dx > 1e-6 ? (W - x) / dx : dx < -1e-6 ? -x / dx : Infinity;
    const ty = dy > 1e-6 ? (GROUND_Y - y) / dy : dy < -1e-6 ? -y / dy : Infinity;
    const t = Math.min(tx, ty);
    if (!isFinite(t) || t < 0.5) break;
    const nx = x + dx * t, ny = y + dy * t;
    segs.push({ x1: x, y1: y, x2: nx, y2: ny }); len += t;
    if (tx <= ty) dx = -dx; else dy = -dy;
    x = nx; y = ny;
  }
  return segs;
}
function segDist(px, py, s) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - s.x1) * dx + (py - s.y1) * dy) / l2, 0, 1) : 0;
  return Math.hypot(px - (s.x1 + t * dx), py - (s.y1 + t * dy));
}
const hitSegs = (e, segs, w) => segs.some((s) => segDist(e.x, e.y, s) <= e.def.r + w / 2);

// ---- bersagli ----
// Il targeting sta tutto qui: aggiungere una modalità = aggiungere un caso.
function pickTargets(pos, range, n) {
  const c = [];
  for (const e of enemies) {
    if (e.dead || e.y < 0) continue;
    const d2 = (e.x - pos.x) ** 2 + (e.y - pos.y) ** 2;
    if (d2 > (range + e.def.r) ** 2) continue;
    c.push({ e, s: settings.targeting === "highest" ? -e.hp : d2 });
  }
  c.sort((a, b) => a.s - b.s);
  return c.slice(0, n).map((x) => x.e);
}
function nearestTo(x, y, maxD, exclude) {
  let best = null, bd = maxD;
  for (const e of living()) { if (exclude && exclude.has(e)) continue; const d = dist(e.x, e.y, x, y); if (d < bd) { bd = d; best = e; } }
  return best;
}

/* =====================================================================
   TORRETTE — ogni fire(s) restituisce true se ha sparato
   ===================================================================== */

// ---------- 1. SKY GUARD (fire) ----------
function skyStats(s) {
  return { dmg: 24 * dmgM(s) * (has(s, "impact") ? 1.8 : 1) * Math.pow(0.85, N(s, "msl")),
           rad: 30 * (1 + 0.3 * N(s, "rad")) };
}
function skyFire(s) {
  const list = living().filter((e) => dist(e.x, e.y, s.x, s.y) <= rangeOf(s) + e.def.r);
  if (!list.length) return false;
  const cnt = 2 + N(s, "msl") + (has(s, "plus2") ? 2 : 0);
  for (let k = 0; k < cnt; k++) missile(s, s.x + (k - (cnt - 1) / 2) * 6, s.y - 10, false, list[Math.floor(Math.random() * list.length)]);
  return true;
}
function missile(s, x, y, mini, target) {
  const turn = mini ? 6 : 3.5, sp = mini ? 300 : 240;
  spawnEnt({ x, y, a: -Math.PI / 2 + rnd(-0.7, 0.7), t: target, age: 0, dead: false,
    update(dt) {
      this.age += dt;
      if (!this.t || this.t.dead) { this.t = randEnemy(); if (!this.t) { this.dead = true; return; } }
      let d = Math.atan2(this.t.y - this.y, this.t.x - this.x) - this.a; d = Math.atan2(Math.sin(d), Math.cos(d));
      this.a += clamp(d, -turn * dt, turn * dt);
      this.x += Math.cos(this.a) * sp * dt; this.y += Math.sin(this.a) * sp * dt;
      if (has(s, "pass") && !mini)
        for (const e of living()) if (dist(e.x, e.y, this.x, this.y) <= e.def.r + 10) skyBurn(s, e, 3, 5 * dmgM(s));
      if (dist(this.t.x, this.t.y, this.x, this.y) <= this.t.def.r + 6) { this.dead = true; skyImpact(s, this.x, this.y, mini); }
      else if (this.age > 9) this.dead = true;
    },
    draw() {                                   // missile: corpo, punta e fiamma in coda
      const ca = Math.cos(this.a), sa = Math.sin(this.a), L = mini ? 5 : 8, wd = mini ? 1.6 : 2.5, x = this.x, y = this.y;
      disc(x - ca * (L + 2), y - sa * (L + 2), wd + 0.8, "#ffd18a", 0.85);
      poly([[x + ca * L, y + sa * L], [x - ca * L - sa * wd, y - sa * L + ca * wd], [x - ca * L + sa * wd, y - sa * L - ca * wd]], "#e8eefc", TYPES.fire.color, 1.2);
    } });
}
// echo = seconda esplosione del level up “Doppio impatto” (60% del danno, senza effetti aggiuntivi)
function skyImpact(s, x, y, mini, echo) {
  const st = skyStats(s), big = mini && has(s, "splitB") && Math.random() < 0.5;    // mini-missile esplosivo: area piena
  const dmg = mini ? st.dmg * 0.35 : echo ? st.dmg * 0.6 : st.dmg, rad = mini && !big ? 14 : st.rad;
  for (const e of living()) if (dist(e.x, e.y, x, y) <= rad + e.def.r) {
    damage(e, dmg, "fire", false, "sky");
    if (!mini && !echo && !e.dead && has(s, "burn1")) skyBurn(s, e, 3, 6 * dmgM(s));
  }
  ring(x, y, rad, TYPES.fire.color, big || echo ? 0.4 : 0.3);
  if (mini || echo) return;

// tutte le bruciature della Sky Guard passano da qui: chain Bruciatura (danno +60%, esplosione alla morte)

// ---------- 2. LASER (energy) ----------

function laserFire(s) {

    update(dt) {

      for (const r of rays) for (const e of living()) if (hitSegs(e, r.segs, r.w)) laserHit(s, e, r.dps * dt, dbMul, true, ign);
    },
    draw() { for (const r of rays) for (const g of r.segs) glow(g.x1, g.y1, g.x2, g.y2, TYPES.energy.color, r.w * 0.45, 1); } });

// ---------- 3. DISRUPTION DRONE (force) ----------
function disrFire(s) {
  const t = pickTargets({ x: s.x, y: s.y }, rangeOf(s), 1)[0];
  if (!t) return false;
  // due droni volano ai lati dello schermo e tra loro si forma il campo: occupa tutta la larghezza;
  // i potenziamenti lo allargano in verticale
  const hh = 16 * (1 + 0.3 * N(s, "height")), dur = 6 * (1 + 0.3 * N(s, "dur"));
  const tick = has(s, "tick") ? 0.6 : 1.0, grip = has(s, "grip"), dmg = 8 * dmgM(s) * (grip ? 1.4 : 1), x0 = s.x, y0 = s.y - 10;
  busy(s, 1);                                             // la ricarica parte solo quando il campo è finito
  spawnEnt({ y: t.y, t: dur, age: 0, acc: 0, dead: false,
    update(dt) {
      this.age += dt; this.t -= dt;
      if (this.t <= 0) { this.dead = true; if (has(s, "blast")) disrBlast(this.y, hh, dmg * 3); busy(s, -1); return; }
      if (this.age < 0.4) return;                           // i droni stanno raggiungendo i lati

          if (has(s, "amp")) { e.fieldT = 0.3; e.fieldAmp = 1.25; }
          if (doTick) {
            damage(e, dmg, "force", false, "disr");
            if (e.dead) continue;
            if (grip && !e.boss) e.y += (this.y - e.y) * 0.5;   // Campo attrattivo: verso la linea centrale del campo
            if (has(s, "dst1")) destruction(s, e, dmg);
            if (has(s, "tp1") && !e.dead) teleportRoll(s, e);
          }
        }
    },
    draw() {
      const k = clamp(this.age / 0.4, 0, 1), a = clamp(this.t / 0.6, 0, 1);
      if (k >= 1) {
        const f = clamp((this.age - 0.4) / 0.2, 0, 1) * a;
        ctx.globalAlpha = 0.2 * f; ctx.fillStyle = TYPES.force.color; ctx.fillRect(0, this.y - hh, W, hh * 2);
        ctx.globalAlpha = 0.8 * f; ctx.strokeStyle = TYPES.force.color; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, this.y - hh); ctx.lineTo(W, this.y - hh); ctx.moveTo(0, this.y + hh); ctx.lineTo(W, this.y + hh); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      for (const tx of [14, W - 14]) {
        const px = x0 + (tx - x0) * k, py = y0 + (this.y - y0) * k;
        ctx.globalAlpha = k >= 1 ? a : 1;
        ctx.beginPath(); ctx.moveTo(px, py - 7); ctx.lineTo(px + 7, py); ctx.lineTo(px, py + 7); ctx.lineTo(px - 7, py); ctx.closePath();
        ctx.fillStyle = TYPES.force.color; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
        ctx.globalAlpha = 1;
      }
    } });
  return true;
}
function disrBlast(y, hh, d) {               // Esplosione finale: tutto il campo, a fine durata
  for (const e of living()) if (Math.abs(e.y - y) <= hh + e.def.r) damage(e, d, "force", false, "disr");
  spawnEnt({ t: 0.35, dead: false, update(dt) { this.t -= dt; if (this.t <= 0) this.dead = true; },
    draw() { ctx.globalAlpha = 0.5 * clamp(this.t / 0.35, 0, 1); ctx.fillStyle = "#e6d4ff"; ctx.fillRect(0, y - hh, W, hh * 2); ctx.globalAlpha = 1; } });
}
function discharge(e, d) { damage(e, d, "force", false, "disr"); ring(e.x, e.y, e.def.r + 10, TYPES.force.color, 0.3); }
function destruction(s, e, dmg) {            // stack "distruzione": −10% danno inflitto, 5 s
  const max = has(s, "dst5") ? 5 : 3;
  e.destrT = 5; e.destrN = Math.min(max, e.destrN + 1);
  if (e.destrN >= max && has(s, "dstB")) {

  }
}
function teleportRoll(s, e) {
  if (e.boss) return;
  let moved = false;
  if (Math.random() < 0.05) { e.y = Math.max(-e.def.r, e.y - 90); moved = true; }
  if (has(s, "tp2") && Math.random() < 0.025) { e.y = 2; moved = true; }
  if (moved) { ring(e.x, Math.max(e.y, 4), e.def.r + 8, TYPES.force.color, 0.3); if (has(s, "tp3")) damage(e, e.hp * 0.2, "force", false, "disr"); }
}

// ---------- 4. AEROBLAST (physical) ----------
function aeroStats(s) {
  return { dmg: 24 * dmgM(s) * Math.pow(0.85, N(s, "proj")), rad: 40 * (has(s, "blast") ? 1.4 : 1), knock: has(s, "knock") ? 30 : 14 };
}
function aeroFire(s) {
  const pos = { x: s.x, y: s.y - 8 }, cnt = 2 + N(s, "proj");
  const list = pickTargets(pos, rangeOf(s), cnt);
  if (!list.length) return false;
  for (let k = 0; k < cnt; k++) {
    const t = list[k % list.length], ft = dist(t.x, t.y, pos.x, pos.y) / 260;
    const tx = clamp(t.x, 0, W), ty = t.y + t.curSpeed * ft;
    spawnEnt({ x: pos.x + (k - (cnt - 1) / 2) * 5, y: pos.y, dead: false,
      update(dt) {
        const d = dist(tx, ty, this.x, this.y), mv = 260 * dt;
        if (d <= mv) { this.dead = true; aeroBoom(s, tx, ty, false); } else { this.x += (tx - this.x) / d * mv; this.y += (ty - this.y) / d * mv; }
      },
      draw() { disc(this.x, this.y, 4.6, "#c7d1e6"); ctx.fillStyle = "#26345c"; ctx.fillRect(this.x - 4.6, this.y - 1, 9.2, 2); disc(this.x, this.y - 5.4, 1.4, "#ffb347"); } });   // bomba
  }
  return true;
}
function aeroBoom(s, x, y, echo) {
  const st = aeroStats(s), f = echo ? 0.6 : 1;
  for (const e of living()) if (dist(e.x, e.y, x, y) <= st.rad + e.def.r) { damage(e, st.dmg * f, "physical", false, "aero"); knock(e, st.knock * f); }
  ring(x, y, st.rad, TYPES.physical.color, 0.35);
  if (echo) return;
  if (has(s, "salvo1")) {
    salvo(s, x, y, 5);
    if (has(s, "salvo2")) later(0.5, () => salvo(s, x, y, 5));
  }
  if (has(s, "mine1")) { const m = has(s, "mine2") ? 2 : 1; for (let i = 0; i < m; i++) mine(s, x + rnd(-14, 14), y + rnd(-8, 8)); }
  if (has(s, "echo")) later(1.0, () => aeroBoom(s, x, y, true));
}
function salvo(s, x, y, cnt) {

  for (let i = 0; i < cnt; i++) {
    const t = nearestTo(x + rnd(-60, 60), y + rnd(-60, 60), 200);
    spawnEnt({ x, y, a: t ? Math.atan2(t.y - y, t.x - x) : rnd(0, 6.28), t, life: 1.2, dead: false,
      update(dt) {
        this.life -= dt; if (this.life <= 0) { this.dead = true; return; }
        if (this.t && !this.t.dead) this.a = Math.atan2(this.t.y - this.y, this.t.x - this.x);
        this.x += Math.cos(this.a) * 340 * dt; this.y += Math.sin(this.a) * 340 * dt;
        for (const e of living()) if (dist(e.x, e.y, this.x, this.y) <= e.def.r + 3) {
          damage(e, st.dmg * 0.3, "physical", false, "aero"); if (has(s, "salvoK")) knock(e, 10); this.dead = true; break;
        }
      },
      draw() { poly([[this.x, this.y - 3], [this.x + 2.4, this.y + 2], [this.x - 2.4, this.y + 2]], TYPES.physical.color); } });   // scheggia
  }
}
function mine(s, x, y) {
  const st = aeroStats(s), mul = has(s, "mineD") ? 1.6 : 1;
  spawnEnt({ x, y, age: 0, dead: false,
    update(dt) {
      this.age += dt; if (this.age > 25) { this.dead = true; return; }
      for (const e of living()) if (dist(e.x, e.y, this.x, this.y) <= e.def.r + 8) {
        this.dead = true; ring(this.x, this.y, 34, TYPES.physical.color, 0.3);
        for (const f of living()) if (dist(f.x, f.y, this.x, this.y) <= 34 + f.def.r) {

        }

      }
    },
    draw() {                                   // mina con le punte
      ctx.strokeStyle = "#8a97b8"; ctx.lineWidth = 1.4; ctx.beginPath();
      for (let i = 0; i < 4; i++) { const a = i * 0.7854; ctx.moveTo(this.x - Math.cos(a) * 6, this.y - Math.sin(a) * 6); ctx.lineTo(this.x + Math.cos(a) * 6, this.y + Math.sin(a) * 6); }
      ctx.stroke(); disc(this.x, this.y, 4, "#26345c"); disc(this.x, this.y, 2.2, TYPES.physical.color, 0.6 + 0.4 * Math.sin(this.age * 6));
    } });
}

// ---------- 5. THUNDERBOLT (electric) ----------
function thunderTick(s, dt) {
  const cnt = 1 + N(s, "sph"), sp = s.st.sph = s.st.sph || [];
  while (sp.length < cnt) sp.push({ th: Math.PI + 0.5 + sp.length * 0.9, dir: 1, aura: 0 });
  sp.length = cnt;
  for (const o of sp) {
    o.th += o.dir * 0.55 * dt;
    if (o.th > 2 * Math.PI - 0.15) { o.th = 2 * Math.PI - 0.15; o.dir = -1; }
    if (o.th < Math.PI + 0.15) { o.th = Math.PI + 0.15; o.dir = 1; }
    o.x = DOME.cx + DOME.rx * Math.cos(o.th); o.y = DOME.cy + DOME.ry * Math.sin(o.th);
    if (has(s, "aura")) {
      o.aura -= dt;
      if (o.aura <= 0) { o.aura = 0.6; for (const e of living()) if (dist(e.x, e.y, o.x, o.y) <= 60 + e.def.r) damage(e, 6 * dmgM(s), "electric", false, "thunder"); }
    }
  }
}
function thunderFire(s) {
  if (!living().length) return false;
  for (const o of s.st.sph || []) thunderBolt(s, o.x, o.y);
  return true;
}
// again = colpo in più del level up “Doppio fulmine” (non ne genera altri)
function thunderBolt(s, x, y0, again) {
  const w = 10 * (has(s, "wide") ? 1.8 : 1), dmg = 16 * dmgM(s) * Math.pow(0.85, N(s, "sph")) * (has(s, "para3") ? 1.3 : 1);
  const paraDur = has(s, "paraT") ? 1.5 : 1;
  const zap = (e) => {                           // chain Fulmini paralizzanti: 30% di paralisi, con la scossa continua se c’è
    if (e.dead || Math.random() >= 0.3) return;
    para(e, paraDur);
    if (has(s, "paraD") && e.paraT > 0) e.shock = Math.max(e.shock, dmg * 0.25);
  };
  const hit = new Set();
  for (const e of living())
    if (Math.abs(e.x - x) <= w / 2 + e.def.r && e.y <= y0 + 12) {
      hit.add(e); damage(e, dmg, "electric", false, "thunder");
      if (has(s, "para1")) zap(e);
      if (has(s, "vuln") && !e.dead) vuln(e, 2.5, "all");
    }
  bolt(zigzag(x, y0, x, 0, 6), TYPES.electric.color, 0.18, w * 0.5);
  const B = has(s, "fork2") ? 6 : has(s, "fork1") ? 4 : 0;
  for (let k = 0; k < B; k++) {
    let best = null, bd = 130;
    for (const e of living()) { if (hit.has(e) || e.y > y0 + 12) continue; const d = Math.abs(e.x - x); if (d < bd) { bd = d; best = e; } }
    if (!best) break;
    hit.add(best); damage(best, dmg * (has(s, "forkW") ? 0.75 : 0.5), "electric", false, "thunder");
    if (has(s, "forkW")) weaken(best, 3);
    if (has(s, "para3")) zap(best);
    bolt(zigzag(x, best.y, best.x, best.y, 4), TYPES.electric.color, 0.15, 1.5);
  }
  if (has(s, "orb") && Math.random() < 0.3) { const e = randEnemy(); if (e) fieldOrb(s, e.x, e.y, B || 3, dmg); }
  if (!again && has(s, "twice") && Math.random() < 0.5) later(0.2, () => thunderBolt(s, x, y0, true));
}
function fieldOrb(s, x, y, B, dmg) {
  spawnEnt({ x, y, t: 4, acc: 0, dead: false,
    update(dt) {
      this.t -= dt; if (this.t <= 0) { this.dead = true; return; }

        this.acc = 0.5; const hit = new Set();

    draw() { disc(this.x, this.y, 6, TYPES.electric.color, 0.9); ring(this.x, this.y, 0, "#fff", 0.001); } });
}

  for (const o of s.st.sph || []) { disc(o.x, o.y, 9, TYPES.electric.color, 0.25); disc(o.x, o.y, 5, "#fff6b0"); }
}

// ---------- 6. BEAM (energy) ----------
function beamFire(s) {
  const pos = { x: s.x, y: s.y - 8 }, rng = rangeOf(s);
  const prim = pickTargets(pos, rng, has(s, "second") ? 2 : 1);
  if (!prim.length) return false;
  const dur = 1.8 * (1 + 0.3 * N(s, "dur")), dps = 24 * dmgM(s) * (has(s, "pace") ? 1.4 : 1);
  const forks = has(s, "fork1") ? 2 + (has(s, "forkN") ? 1 : 0) : 0, pull = has(s, "pull"), boom = has(s, "forkX");
  // Raggio amplificato: il danno sul bersaglio principale sale del 70% al secondo fino al massimo (×2, ×4 al lv3)

        }

        for (let k = 0; k < forks; k++) {
          const nx = nearestTo(p.x, p.y, 220, hit); if (!nx) break;
          hit.add(nx); this.links.push([p, nx]); branches.push([p, nx]);
        }

      for (let i = 0; i < prim.length; i++) if (prim[i]) this.amp[i] = Math.min(ampMax, this.amp[i] + 0.7 * dt);
      for (const e of hit) {
        const i = prim.indexOf(e);
        const d = dps * dt * (i >= 0 ? this.amp[i] : 1) * (e.boss && has(s, "boss") ? 1.5 : 1);
        damage(e, d, "energy", true, "beam"); if (has(s, "vuln") && !e.dead) vuln(e, 2, "all");
        if (i >= 0 && e.dead && has(s, "feed") && this.ext < dur) {      // Raggio vorace: +25% della durata per uccisione, fino al doppio

          for (const e of living()) if (dist(e.x, e.y, p.x, p.y) <= 40 + e.def.r) damage(e, dps * 0.5, "energy", false, "beam");
          ring(p.x, p.y, 40, TYPES.energy.color, 0.3);
        }
      }
    },
    draw() { for (const [a, b] of this.links) glow(a.x, a.y - (a === pos ? 0 : 0), b.x, b.y, TYPES.energy.color, 2.6, 1); } });
  return true;
}

// ---------- 7. FIREWHEEL DRONE (fire) ----------
function wheelFire(s) {
  if (!living().length) return false;
  const heat = has(s, "heat") ? 1.6 : 1, launch = { hit: new Set() };     // launch.hit: nemici colpiti da tutto il lancio (Raffreddamento)
  const dur = 5 * (1 + 0.3 * N(s, "dur")), rad = 55 * (1 + 0.3 * N(s, "rad")), dps = 20 * dmgM(s) * heat;
  wheelDrone(s, s.x, s.y - 14, rnd(-2.4, -0.7), { mini: false, dur, rad, dps, launch });

const FRENZY = { fill: [30, 25], dur: [8, 12], rate: 1.8, rateFast: 2, dmg: 1.35 };

    ang = Math.atan2(aim.y - pos.y, aim.x - pos.x);          // altrimenti vanno dritti verso il punto premuto

const maxedCount = () => [player, ...slots].filter((t) => t && t.done).length;

  if (s.used >= 3) {      // serve un level up per procedere
    if (cap < 3 && s.level >= cap) return out;                       // livello successivo non ancora sbloccato
    if (s.level === 3 && campLevel >= CAMPAIGN.maxMaxedFrom && maxedCount() >= CAMPAIGN.maxMaxed) return out;   // già 2 al massimo
    for (const u of ups) if (u.cat === "lu" && u.lv <= s.level && !has(s, u.id)) out.push(u);
    return out;
  }
  for (const u of ups) {
    if (u.cat === "std") { if (N(s, u.id) < 3) out.push(u); }
    else if (u.cat === "chain") {
      if (has(s, u.id) || u.lv > s.level) continue;                   // le chain lv2/lv3 solo se la torre è al livello 2/3
      if (u.lv === 1 || ups.some((v) => v.cat === "chain" && v.chain === u.chain && v.lv === u.lv - 1 && has(s, v.id))) out.push(u);
    } else if (u.cat === "combo") {
      if (!has(s, u.id) && (u.lv || 1) <= s.level && u.needs && slots.some((t) => t && t.id === u.needs)) out.push(u);
    }
  }

}

  s.up[u.id] = N(s, u.id) + 1;

  else s.used++;
}

function rollOptions() {
  const cands = [], owned = slots.filter(Boolean);
  if (slots.indexOf(null) >= 0)
    for (const id of TURRET_ORDER)
      if (!owned.some((s) => s.id === id)) cands.push({ w: owned.length < 2 ? 3 : 1.5, opt: { kind: "new", id } });
  for (const who of [player, ...owned])
    for (const u of eligible(who)) cands.push({ w: UP_W[u.cat], opt: { kind: "up", who, up: u } });
  const out = [];
  while (out.length < 3 && cands.length) {
    let r = Math.random() * cands.reduce((a, c) => a + c.w, 0), i = 0;
    while (i < cands.length - 1 && (r -= cands[i].w) > 0) i++;
    out.push(cands.splice(i, 1)[0].opt);
  }

}

const CAT_LABEL = { std: "Standard", chain: "Chain", lu: "Level up", combo: "Combo" };

  }

  if (u.cat === "std") note = "Pila " + (N(s, u.id) + 1) + "/3 · livello " + s.level + " (" + (s.used + 1) + "/3)";
  else if (u.cat === "chain") note = "Chain lv " + u.lv + " · livello " + s.level + " (" + (s.used + 1) + "/3)";
  else note = s.level < 3 ? "Porta al livello " + (s.level + 1) : "Potenziamento finale";

  slots = [null, null, null, null];

}

// tra un’ondata e l’altra la frenesia attiva resta in pausa e continua nell’ondata successiva
function startWave(n) {
  wave = n; waveTime = -1.2; ents = [];
  for (const s of [player, ...slots]) if (s) { s.st = s.id === "player" ? { charge: s.st.charge, frenzyT: s.st.frenzyT || 0 } : {}; s.busy = 0; s.cd = Math.min(s.cd, 0.8); }
  queue = [];
  for (const g of waveSpec(n, curDiff()).groups)
    for (let i = 0; i < g.count; i++)
      queue.push({ t: g.at + i * g.every, enemy: g.enemy, x: 30 + Math.random() * (W - 60) });
  if (hasMiniBosses() && CAMPAIGN.bossWaves.includes(n))                       // mini-boss
    queue.push({ t: 3, enemy: "boss", def: bossDef(campLevel, n), x: W / 2 });
  if (n === N_WAVES && hasFinalBoss())                                         // boss finale

function spawn(q) {
  const d = q.def || ENEMY_DEFS[q.enemy], D = curDiff(), hp = d.hp * levelHp(D) * waveHp(wave);
  enemies.push({
    def: d, boss: !!d.boss, final: !!d.final, kbRes: d.kbRes || 0, statRes: d.statRes || 0, x: q.x, y: -d.r, hp, maxHp: hp,
    speed: d.speed * levelSpeed(D) * waveSpeed(wave), curSpeed: 0, dmg: d.dmg * levelDmg(D) * waveDmg(wave),
    flash: 0, phase: rnd(0, 6.28), dead: false, acc: 0, accT: 0, atk: 0.3,
    shape: Array.from({ length: 9 }, () => 0.74 + Math.random() * 0.34), rot: rnd(0, 6.28), spin: rnd(-0.8, 0.8),
    slowT: 0, destrN: 0, destrT: 0, burnT: 0, burnDps: 0, skyBurnT: 0, skyBurnS: null, fireVulnT: 0, shock: 0, shockCd: 0, weakT: 0, vulnT: 0, vulnType: "all", paraT: 0, fieldT: 0, fieldAmp: 1, tpCd: 0,

function touchesDome(e) {

}

function toLogical(e) {
  const r = cv.getBoundingClientRect(), w = r.width || W, h = r.height || H;
  return { x: (e.clientX - r.left) * W / w, y: (e.clientY - r.top) * H / h };
}
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const p = toLogical(e);
  for (const b of buttons) if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.onTap(); return; }
  if (state === "play") {
    dragging = true;
    if (manual) { aim.x = p.x; aim.y = Math.min(p.y, GROUND_Y - 50); aim.down = true; } else player.targetX = p.x;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  }
});
cv.addEventListener("pointermove", (e) => {
  if (!dragging || state !== "play") return;
  const p = toLogical(e);
  if (manual) { aim.x = p.x; aim.y = Math.min(p.y, GROUND_Y - 50); } else player.targetX = p.x;
});
const stopDrag = () => { dragging = false; aim.down = false; };
cv.addEventListener("pointerup", stopDrag);
cv.addEventListener("pointercancel", stopDrag);
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (state === "save") { if (k === "escape") closeSave(); return; }   // mentre si scrive nel pannello i tasti non comandano il gioco
  if (state === "menu" && (k === "arrowleft" || k === "arrowright" || k === "a" || k === "d"))
    selLevel = clamp(selLevel + (k === "arrowright" || k === "d" ? 1 : -1), 1, maxSelectable());
  if (k === "arrowleft" || k === "a") keys.left = 1;
  else if (k === "arrowright" || k === "d") keys.right = 1;
  else if ((k === "p" || k === "escape") && state === "play") pauseGame();
  else if ((k === "p" || k === "escape" || k === "enter" || k === " ") && state === "pause") resumeGame();
  else if (k === "tab" && state === "pause") { e.preventDefault(); pauseTab = pauseTab === "enemies" ? "build" : "enemies"; }
  else if (k === "t" && (state === "play" || state === "upgrade")) toggleTargeting();
  else if (state === "upgrade" && rewards && (k === "enter" || k === " " || k === "1")) pick(0);
  else if (state === "upgrade" && (k === "1" || k === "2" || k === "3")) pick(+k - 1);
  else if (state === "menu" && (k === "enter" || k === " ")) startRun("standard");
  else if (state === "menu" && k === "e") { if (epicUnlocked()) startRun("epic"); }
  else if (state === "menu" && k === "m") toggleAim();
  else if (state === "won" && (k === "enter" || k === " ")) nextOrRetry();
  else if (state === "lost" && (k === "enter" || k === " ")) retry();
  else if ((state === "won" || state === "lost") && k === "m") toMenu();
});
window.addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (k === "arrowleft" || k === "a") keys.left = 0;
  else if (k === "arrowright" || k === "d") keys.right = 0;
});

const APP_VERSION = "1.0.0";
const SAVE_GAME = "fortress-defense", SAVE_VERSION = 1, CODE_PREFIX = "FD1:";
const $id = (id) => document.getElementById(id);
function makeSave() {
  return { game: SAVE_GAME, version: SAVE_VERSION, appVersion: APP_VERSION, exportedAt: new Date().toISOString(),
    progress: { cleared: progress.cleared, seen: [...progress.seen] },
    settings: { targeting: settings.targeting, aim: settings.aim } };
}
const makeCode = () => CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(makeSave()))));
function parseSave(text) {                      // controlla tutto prima di toccare i progressi
  let t = String(text || "").trim();
  if (!t) throw new Error("Non c’è niente da importare.");
  const isCode = t.startsWith(CODE_PREFIX);
  if (isCode) {
    try { t = decodeURIComponent(escape(atob(t.slice(CODE_PREFIX.length).replace(/\s+/g, "")))); }
    catch (e) { throw new Error("Il codice non è valido o è incompleto."); }
  }
  let d;
  try { d = JSON.parse(t); } catch (e) { throw new Error(isCode ? "Il codice non è valido o è incompleto." : "Non è un salvataggio leggibile."); }
  if (!d || d.game !== SAVE_GAME) throw new Error("Non è un salvataggio di Fortress Defense.");
  if (!(d.version >= 1) || d.version > SAVE_VERSION) throw new Error("Versione del salvataggio non supportata.");
  const p = d.progress || {}, s = d.settings || {};
  if (!Number.isFinite(p.cleared)) throw new Error("Il salvataggio non contiene i livelli completati.");
  return {
    cleared: clamp(Math.floor(p.cleared), 0, CAMPAIGN.maxLevel),
    seen: Array.isArray(p.seen) ? [...new Set(p.seen.filter((k) => typeof k === "string" && k.length < 40 && k !== "ship" && k !== "mothership"))].slice(0, 50) : [],
    targeting: s.targeting === "highest" ? "highest" : "closest",
    aim: s.aim === "manual" ? "manual" : "auto",
    exportedAt: typeof d.exportedAt === "string" && !isNaN(Date.parse(d.exportedAt)) ? d.exportedAt : null,
  };
}
function applySave(d) {
  progress.cleared = d.cleared; progress.seen = d.seen;
  settings.targeting = d.targeting; settings.aim = d.aim;
  saveProgress(); saveSettings(); selLevel = maxSelectable();
}
let pendingSave = null;
function refreshSavePanel(msg, isErr) {
  $id("saveInfo").textContent = "Ora: " + progress.cleared + " livelli completati · " + progress.seen.length + " nemici scoperti · mira " + AIM_LABEL[settings.aim];
  $id("confirmBox").hidden = !pendingSave;
  if (pendingSave) {
    const when = pendingSave.exportedAt ? " del " + new Date(pendingSave.exportedAt).toLocaleDateString("it-IT") : "";
    $id("confirmText").textContent = "Il salvataggio" + when + " ha " + pendingSave.cleared + " livelli completati e " + pendingSave.seen.length +
      " nemici scoperti. Sostituisce i progressi attuali (" + progress.cleared + " livelli, " + progress.seen.length + " nemici).";
  }
  const m = $id("saveMsg"); m.textContent = msg || ""; m.classList.toggle("err", !!isErr);
}
function stageSave(text) {
  try { pendingSave = parseSave(text); refreshSavePanel(); }
  catch (e) { pendingSave = null; refreshSavePanel(e.message, true); }
}
function openSave() { state = "save"; pendingSave = null; $id("codeBox").value = ""; refreshSavePanel(); $id("savePanel").hidden = false; }
function closeSave() { $id("savePanel").hidden = true; pendingSave = null; state = "menu"; }
$id("btnExport").addEventListener("click", async () => {
  const json = JSON.stringify(makeSave(), null, 2), name = "fortress-salvataggio-" + new Date().toISOString().slice(0, 10) + ".json";
  try {                                          // sul telefono: foglio di condivisione (File, Drive, mail…)
    const file = new File([json], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Salvataggio Fortress Defense" });
      refreshSavePanel("File pronto: " + name); return;
    }
  } catch (e) { if (e && e.name === "AbortError") { refreshSavePanel(); return; } }
  try {                                          // altrimenti: scaricamento
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    refreshSavePanel("File scaricato: " + name);
  } catch (e) { refreshSavePanel("Esportazione non riuscita: usa “Copia codice”.", true); }
});
$id("btnCopy").addEventListener("click", async () => {
  const code = makeCode();
  try { await navigator.clipboard.writeText(code); refreshSavePanel("Codice copiato: incollalo in una nota o in un messaggio per conservarlo."); }
  catch (e) { $id("codeBox").value = code; $id("codeBox").select(); refreshSavePanel("Copia il codice selezionato qui sopra."); }
});
$id("fileImport").addEventListener("change", () => {
  const f = $id("fileImport").files[0]; $id("fileImport").value = "";
  if (!f) return;
  if (f.size > 200000) { refreshSavePanel("Il file è troppo grande per essere un salvataggio.", true); return; }
  const r = new FileReader();
  r.onload = () => stageSave(r.result);
  r.onerror = () => refreshSavePanel("Impossibile leggere il file.", true);
  r.readAsText(f);
});
$id("btnPaste").addEventListener("click", () => stageSave($id("codeBox").value));
$id("btnConfirm").addEventListener("click", () => { if (!pendingSave) return; applySave(pendingSave); pendingSave = null; $id("codeBox").value = ""; refreshSavePanel("Salvataggio importato."); });
$id("btnCancel").addEventListener("click", () => { pendingSave = null; refreshSavePanel("Importazione annullata."); });
$id("btnClose").addEventListener("click", closeSave);
// chiede al browser di non cancellare i dati del gioco quando lo spazio scarseggia
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

player = makeShooter(PLAYER_DEF, W / 2, GROUND_Y - 30); player.targetX = W / 2;
slots = [null, null, null, null];

let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t; clock += dt;
  if (state === "play") update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<script>
// installabile e giocabile offline: il service worker funziona solo in HTTPS (o su localhost)
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
